<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Compte">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mon Compte</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri2:#ccfbf1;--red:#dc2626;--grn:#15803d;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--line:#1f2a40;--pri:#2dd4bf;--pri2:#0f3d3a;--red:#f87171;--grn:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(90px + env(safe-area-inset-bottom))}
h2{margin:6px 0 10px;font-size:22px}
h3{margin:0 0 10px}
.mut{color:var(--mut)}
.s{font-size:12px;color:var(--mut)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}
.big{font-size:22px;font-weight:700;margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--grn)}
.warn{border-left:4px solid var(--warn)}
.pseg{display:flex;gap:6px;margin:4px 0 8px}.pseg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 2px;font-size:14px}.pseg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.mnav b{text-align:center}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mnav button{border:0;background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:12px;font-size:22px}
button,.btn{font:inherit}
.btn,.primary{display:inline-block;border:0;background:var(--pri);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;text-align:center}
@media(prefers-color-scheme:dark){.btn,.primary{color:#04201e}}
.ghost{border:1px solid var(--line);background:transparent;color:var(--tx);padding:12px 16px;border-radius:12px}
.danger{border:1px solid var(--red);background:transparent;color:var(--red);padding:12px 16px;border-radius:12px}
.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .d{width:42px;color:var(--mut);font-size:13px}
.row .m{flex:1;min-width:0}
.row .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right}
input,select{font:inherit;font-size:16px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mut)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--tx)}
.seg input{width:auto;margin:0 6px 0 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.over{background:var(--red)}
details{border-bottom:1px solid var(--line);padding:8px 0}
details:last-child{border-bottom:0}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.sr{display:flex;justify-content:space-between;font-weight:600}
.sub{display:flex;justify-content:space-between;padding:4px 0 0 12px;color:var(--mut);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 2px;font-size:12px}
nav button.on{color:var(--pri);font-weight:700}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:8px 12px;text-align:left}
.chip.on{border-color:var(--pri);color:var(--tx);box-shadow:inset 0 0 0 1px var(--pri)}
.chip b{display:block;font-size:14px}
.chip span{font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<nav>
<button data-a="nav" data-v="home">Accueil</button>
<button data-a="nav" data-v="tx">Lignes</button>
<button data-a="nav" data-v="rec">Récurrent</button>
<button data-a="nav" data-v="imp">Import</button>
<button data-a="nav" data-v="set">Réglages</button>
</nav>
<script>
const KEY='compte-salaire-v1';
const CATS={
 'Revenus':['Salaire','Primes','Remboursements','Intérêts','Autres revenus'],
 'Logement':['Loyer / crédit','Charges','Énergie','Internet / téléphone','Assurance habitation','Travaux / mobilier'],
 'Voiture':['Carburant','Assurance','Entretien / réparations','Péage / parking','Crédit / leasing'],
 'Alimentation':['Courses'],
 'Santé':['Mutuelle','Pharmacie / médecin'],
 'Loisirs':['Restaurants / bars','Sorties','Abonnements','Voyages / vacances','Shopping'],
 'Finances':['Épargne','Impôts','Frais bancaires','Crédits'],
 'Divers':['Cadeaux','Imprévus','Non classé']
};
const RK='Loisirs|Restaurants / bars';
const defaultState=()=>({v:2,accounts:[{id:'a1',name:'Compte salaire',type:'courant',opening:0,cash:true}],shown:['a1'],tx:[],rec:[],plans:[],rules:[],budgets:{},csvMaps:{},skips:[],lastExport:null});
function migrate(raw){
 const o=Object.assign(defaultState(),raw||{});
 if(!raw||!Array.isArray(raw.accounts)||!raw.accounts.length){o.accounts=[{id:'a1',name:'Compte salaire',type:'courant',opening:(raw&&raw.opening)||0,cash:true}];o.shown=['a1'];}
 const first=o.accounts[0].id;
 o.accounts.forEach(a=>{if(a.type==='paypal')a.type='courant';});
 o.tx.forEach(t=>{if(!t.acc)t.acc=first;});
 o.rec.forEach(r=>{if(!r.acc)r.acc=first;});
 if(!Array.isArray(o.shown))o.shown=o.accounts.map(a=>a.id);
 o.shown=o.shown.filter(id=>o.accounts.some(a=>a.id===id));
 o.accounts.forEach(a=>{
  if(!a.anchor&&Math.abs(a.opening||0)>=0.005){
   const t=ymd(new Date());
   a.anchor={date:t,amount:Math.round(((a.opening||0)+o.tx.filter(x=>x.acc===a.id&&x.date<=t).reduce((s,x)=>s+x.amount,0))*100)/100};
  }
 });
 delete o.opening;o.v=2;return o;
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}return migrate(null);}
let S=load();
function reanchor(){
 S.accounts.forEach(a=>{if(a.anchor)a.opening=Math.round((a.anchor.amount-S.tx.filter(t=>t.acc===a.id&&t.date<=a.anchor.date).reduce((s,t)=>s+t.amount,0))*100)/100;});
}
function save(){reanchor();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert("Impossible d'enregistrer : stockage plein ou bloqué.");}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const monthOf=d=>d.slice(0,7);
function addMonths(m,k){let [y,mm]=m.split('-').map(Number);mm+=k-1;y+=Math.floor(mm/12);mm=((mm%12)+12)%12;return y+'-'+pad(mm+1);}
const monthLabel=m=>{const [y,mm]=m.split('-').map(Number);const s=new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);};
const dim=(y,m)=>new Date(y,m,0).getDate();
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const frDate=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);

/* ---------- logique ---------- */
function sortedTx(){return S.tx.map((t,i)=>[t,i]).sort((a,b)=>a[0].date<b[0].date?-1:a[0].date>b[0].date?1:a[1]-b[1]).map(x=>x[0]);}
const ACC_TYPES={courant:'Compte courant',livret:'Livret',credit:'Carte de crédit',differe:'Carte bancaire à débit différé',emprunt:'Emprunt'};
const creditInfo=a=>{const bal=accBalance(a.id,today()),lim=a.limit||0;return{lim,due:Math.max(0,-bal),avail:lim+bal};};
const accById=id=>S.accounts.find(a=>a.id===id);
const accName=id=>{const a=accById(id);return a?(a.group?a.group+' · ':'')+a.name:'?';};
const groupOpts=()=>[...new Set(S.accounts.map(a=>a.group).filter(Boolean))].sort().map(g=>`<option value="${esc(g)}">`).join('');
const inScope=t=>S.shown.includes(t.acc);
function defAcc(){return S.shown[0]||S.accounts[0].id;}
function scopeAccs(cashOnly){return S.accounts.filter(a=>S.shown.includes(a.id)&&(!cashOnly||a.cash));}
function openingSum(cashOnly){return scopeAccs(cashOnly).reduce((s,a)=>s+(a.opening||0),0);}
function balanceAt(date,cashOnly){const ids=new Set(scopeAccs(cashOnly).map(a=>a.id));return openingSum(cashOnly)+S.tx.filter(t=>ids.has(t.acc)&&t.date<=date).reduce((s,t)=>s+t.amount,0);}
function accBalance(id,date){const a=accById(id);return ((a&&a.opening)||0)+S.tx.filter(t=>t.acc===id&&(!date||t.date<=date)).reduce((s,t)=>s+t.amount,0);}
function adjRows(){
 return scopeAccs(false).filter(a=>a.anchor&&Math.abs(a.opening||0)>=0.005).map(a=>{
  const ds=S.tx.filter(t=>t.acc===a.id).map(t=>t.date).concat([a.anchor.date]);
  return{id:'adj_'+a.id,virtual:true,date:ds.reduce((m,x)=>x<m?x:m),label:'Ajustement de solde',amount:a.opening,cat:'Ajustement',sub:'Solde initial',payee:'',acc:a.id};
 });
}
function withBalance(){
 const adj=adjRows(),ids=new Set(adj.map(r=>r.acc));
 let b=scopeAccs(false).filter(a=>!ids.has(a.id)).reduce((s,a)=>s+(a.opening||0),0);
 const rows=sortedTx().filter(inScope);
 return adj.map(r=>[r,-1]).concat(rows.map((t,i)=>[t,i])).sort((x,y)=>x[0].date<y[0].date?-1:x[0].date>y[0].date?1:x[1]-y[1]).map(x=>x[0]).map(t=>{b+=t.amount;return Object.assign({},t,{bal:b});});
}
function xferOther(t){return t.xfer?S.tx.find(x=>x.xfer===t.xfer&&x.id!==t.id):null;}
function createTransfer(from,to,amt,date,label){
 const pid=uid();
 S.tx.push({id:uid(),date,label,amount:-amt,cat:'Virement',sub:'Entre comptes',payee:'',acc:from,xfer:pid},{id:uid(),date,label,amount:amt,cat:'Virement',sub:'Entre comptes',payee:'',acc:to,xfer:pid});
 return pid;
}
function linkTransfer(t,otherAcc){
 const pid=uid();
 const loan=((accById(otherAcc)||{}).type==='emprunt')&&t.amount<0;
 const sub=loan?'Remboursement':'Entre comptes';
 const cand=S.tx.find(x=>x.acc===otherAcc&&!x.xfer&&x.id!==t.id&&Math.abs(x.amount+t.amount)<0.005&&Math.abs((new Date(x.date+'T12:00:00')-new Date(t.date+'T12:00:00'))/86400000)<=5);
 t.xfer=pid;
 if(loan)t.cnt=true;else{t.cat='Virement';t.sub='Entre comptes';}
 if(cand){cand.xfer=pid;cand.cat='Virement';cand.sub=sub;return 'lié';}
 S.tx.push({id:uid(),date:t.date,label:t.label,amount:-t.amount,cat:'Virement',sub,payee:'',acc:otherAcc,xfer:pid});
 return 'créé';
}
function unlinkTransfer(pid){
 const legs=S.tx.filter(x=>x.xfer===pid);
 if(legs.some(x=>x.cnt)){
  S.tx=S.tx.filter(x=>!(x.xfer===pid&&!x.cnt));
  legs.filter(x=>x.cnt).forEach(x=>{delete x.xfer;delete x.cnt;});
  return;
 }
 legs.forEach(x=>{const c=autoCat(x.label,x.amount);x.cat=c.cat;x.sub=c.sub;if(!x.payee)x.payee=c.payee||'';delete x.xfer;});
}

function occ(r,m){
 const [y,mm]=m.split('-').map(Number);const out=[];const last=dim(y,mm);
 const start=r.start||'0000-01-01';const end=r.end||'9999-12-31';
 const add=d=>{if(d>=start&&d<=end)out.push(d);};
 if(r.freq==='monthly'){add(y+'-'+pad(mm)+'-'+pad(Math.min(r.day||1,last)));}
 else if(r.freq==='yearly'){const sp=start.split('-').map(Number);if(sp[1]===mm)add(y+'-'+pad(mm)+'-'+pad(Math.min(sp[2],last)));}
 else{
  const step=r.freq==='weekly'?7*(r.every||1):(r.every||1);
  const s=new Date(start+'T12:00:00');
  for(let d=1;d<=last;d++){const cur=new Date(y,mm-1,d,12);const diff=Math.round((cur-s)/86400000);if(diff>=0&&diff%step===0)add(ymd(cur));}
 }
 return out;
}
function amountAt(r,d){
 if(!r.hist||!r.hist.length)return r.amount;
 let v=r.hist[0].amount;
 for(const e of r.hist){if(e.from<=d)v=e.amount;}
 return v;
}
function dueItems(m){
 const have=new Set(S.tx.filter(t=>t.recKey).map(t=>t.recKey).concat(S.skips));
 const out=[];
 S.rec.filter(r=>S.shown.includes(r.acc)).forEach(r=>occ(r,m).forEach(d=>{const k=r.id+'|'+d;if(!have.has(k))out.push({r,d,k,amount:amountAt(r,d)});}));
 S.plans.filter(pl=>S.shown.includes(pl.acc)).forEach(pl=>pl.items.forEach((it,i)=>{
  if(monthOf(it.date)!==m)return;
  const k=pl.id+'|'+it.date;if(have.has(k))return;
  out.push({r:{id:pl.id,label:pl.label+' ('+(i+1)+'/'+pl.items.length+')',cat:pl.cat,sub:pl.sub,acc:pl.acc,payee:pl.payee||''},d:it.date,k,amount:it.amount,plan:pl.id});
 }));
 S.accounts.filter(a=>a.type==='differe'&&a.debitAcc&&S.shown.includes(a.id)&&S.shown.includes(a.debitAcc)).forEach(a=>{
  const dd=debitDates(a);
  [dd.last,dd.next].forEach(d=>{
   if(monthOf(d)!==m)return;
   const k='dif'+a.id+'|'+d;if(have.has(k))return;
   const owed=Math.max(0,-accBalance(a.id,d));if(owed<0.005)return;
   out.push({r:{id:'dif'+a.id,label:'Prélèvement '+accName(a.id),cat:'Virement',sub:'Entre comptes',acc:a.debitAcc,payee:'',loan:a.id},d,k,amount:-Math.round(owed*100)/100,noproj:true});
  });
 });
 return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function debitDates(a){
 const t=today(),ym=t.slice(0,7);
 const at=m=>{const [y,mm]=m.split('-').map(Number);return m+'-'+pad(Math.min(a.debitDay||1,dim(y,mm)));};
 const d0=at(ym);
 return d0<=t?{last:d0,next:at(addMonths(ym,1))}:{last:at(addMonths(ym,-1)),next:d0};
}
function dueRange(f,e){
 const out=[];
 for(let m=monthOf(f);m<=monthOf(e);m=addMonths(m,1))dueItems(m).forEach(x=>{if(x.d>=f&&x.d<=e)out.push(x);});
 return out;
}
function planKeys(){return new Set(S.tx.filter(t=>t.recKey).map(t=>t.recKey).concat(S.skips));}
function planStats(pl){
 const have=planKeys();
 const open=pl.items.filter(it=>!have.has(pl.id+'|'+it.date));
 return{done:pl.items.length-open.length,total:pl.items.length,rest:open.reduce((a,it)=>a-it.amount,0)};
}
function makePlanItems(total,n,start){
 const cents=Math.round(total*100),baseC=Math.floor(cents/n);
 const day=parseInt(start.slice(8)),m0=monthOf(start),items=[];
 for(let i=0;i<n;i++){
  const m=addMonths(m0,i),[y,mm]=m.split('-').map(Number);
  const c=i<n-1?baseC:cents-baseC*(n-1);
  items.push({date:m+'-'+pad(Math.min(day,dim(y,mm))),amount:-c/100});
 }
 return items;
}
function autoCat(label,amount,payee){
 const n=norm(label+' '+(payee||''));
 for(const r of S.rules){if(n.includes(r.kw))return{cat:r.cat,sub:r.sub,payee:r.payee||payee||''};}
 return amount>0?{cat:'Revenus',sub:'Autres revenus',payee:payee||''}:{cat:'Divers',sub:'Non classé',payee:payee||''};
}
function kwFrom(label){
 const stop=['CARTE','PAIEMENT','PRLV','VIR','VIREMENT','CB','PRELEVEMENT','SEPA','ACHAT','FACTURE'];
 const w=norm(label).split(' ').filter(x=>x.length>2&&!/^\d+$/.test(x)&&!stop.includes(x));
 return w.slice(0,2).join(' ');
}
function linkRec(tx){
 const n=norm(tx.label);
 const have=new Set(S.tx.filter(t=>t.recKey).map(t=>t.recKey));
 for(const r of S.rec){
  if(r.acc&&tx.acc&&r.acc!==tx.acc)continue;
  const kw=norm(r.match||r.label);
  if(!kw||!n.includes(kw))continue;
  const base=monthOf(tx.date);
  for(const m of [addMonths(base,-1),base,addMonths(base,1)]){
   for(const d of occ(r,m)){
    const k=r.id+'|'+d;
    const diff=Math.abs(Math.round((new Date(tx.date+'T12:00:00')-new Date(d+'T12:00:00'))/86400000));
    if(diff<=7&&!have.has(k)){tx.recKey=k;tx.cat=r.cat;tx.sub=r.sub;return;}
   }
  }
 }
 for(const pl of S.plans){
  if(pl.acc&&tx.acc&&pl.acc!==tx.acc)continue;
  const kw=norm(pl.match||pl.label);
  if(!kw||!n.includes(kw))continue;
  for(const it of pl.items){
   const k=pl.id+'|'+it.date;
   const diff=Math.abs(Math.round((new Date(tx.date+'T12:00:00')-new Date(it.date+'T12:00:00'))/86400000));
   if(diff<=7&&!have.has(k)){tx.recKey=k;tx.cat=pl.cat;tx.sub=pl.sub;if(pl.payee&&!tx.payee)tx.payee=pl.payee;return;}
  }
 }
}
function monthStats(m){return statsRange(m+'-01',m+'-31');}
function statsRange(f,e){
 const byCat={},byInc={};let inc=0,exp=0;
 S.tx.forEach(t=>{
  if(t.date<f||t.date>e||!inScope(t)||(t.xfer&&!t.cnt))return;
  if(t.cat==='Revenus'){inc+=t.amount;byInc[t.sub]=(byInc[t.sub]||0)+t.amount;}
  else{exp-=t.amount;const c=byCat[t.cat]||(byCat[t.cat]={total:0,subs:{}});c.total-=t.amount;c.subs[t.sub]=(c.subs[t.sub]||0)-t.amount;}
 });
 return{inc,exp,byCat,byInc};
}
function spentFor(m,key){return spentRange(m+'-01',m+'-31',key);}
function spentRange(f,e,key){
 const [c,s]=key.split('|');let v=0;
 S.tx.forEach(t=>{if(t.date>=f&&t.date<=e&&inScope(t)&&!(t.xfer&&!t.cnt)&&t.cat===c&&t.cat!=='Revenus'&&(!s||t.sub===s))v-=t.amount;});
 return v;
}
function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/).find(l=>l.trim())||'';
 const sep=[';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;
  else if(c===sep){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
  else cur+=c;

}
function parseAmount(s){
 if(s==null)return NaN;
 s=String(s).replace(/[€\s\u00a0]/g,'');
 if(s==='')return NaN;
 const neg=/^\(.*\)$/.test(s)||/\d-$/.test(s);
 s=s.replace(/[()]/g,'').replace(/-$/,'');
 if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}
 else if(s.includes(','))s=s.replace(',','.');
 const v=parseFloat(s);
 if(isNaN(v))return NaN;
 return neg?-Math.abs(v):v;
}
function parseDate(s){
 s=String(s||'').trim();
 let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
 m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
 if(m){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+pad(+m[2])+'-'+pad(+m[1]);}
 return null;
}

function impParse(){
 const m=imp.map,ok=[];let bad=0;
 imp.data.forEach(r=>{
  const date=parseDate(r[m.date]);
  const label=String(r[m.label]==null?'':r[m.label]).trim();
  let amt;
  if(m.mode==='single')amt=parseAmount(r[m.amount]);
  else{const d=parseAmount(r[m.debit]),c=parseAmount(r[m.credit]);amt=(isNaN(c)?0:Math.abs(c))-(isNaN(d)?0:Math.abs(d));if(isNaN(c)&&isNaN(d))amt=NaN;}
  if(!date||isNaN(amt)||amt===0){bad++;return;}
  const payee=m.payee>=0?String(r[m.payee]==null?'':r[m.payee]).trim():'';
  ok.push({date,label:label||payee||'Sans libellé',payee,amount:Math.round(amt*100)/100});
 });
 return{ok,bad};
}

 <label>Sous-catégorie<select id="pl_sub">${subOptions(d.cat,d.sub)}</select></label>
 <label>Mot-clé pour reconnaître la ligne dans le CSV (facultatif)<input id="pl_match" value="${esc(d.match||'')}"></label>`;
 const body=pl
  ?`<b>Échéances</b><p class="s" style="margin-top:2px">Tu peux changer le montant ou la date d'une échéance pas encore réglée, par exemple le dernier paiement.</p>`
   +pl.items.map((it,i)=>{
    const k=pl.id+'|'+it.date;
    if(lock.has(k))return `<div class="row"><div class="m">${S.skips.includes(k)?'ignorée':'✓'} ${frDate(it.date)}</div><div class="a">${fmt(it.amount)}</div></div>`;
    return `<div class="row" style="gap:6px"><input type="date" id="pi_d${i}" value="${esc(it.date)}" style="flex:1;margin:0"><input id="pi_a${i}" inputmode="decimal" value="${String(Math.abs(it.amount)).replace('.',',')}" style="width:100px;margin:0"></div>`;
   }).join('')
  :`<label>Montant total (€)<input id="pl_total" inputmode="decimal"></label>
 <label>Nombre d'échéances (une par mois)<input id="pl_n" type="number" min="2" max="60" value="3"></label>
 <label>Date de la 1re échéance<input id="pl_start" type="date" value="${today()}"></label>
 <p class="s">Montants égaux ; la dernière échéance prend l'éventuel reste d'arrondi. Tu pourras la modifier ensuite.</p>`;
 openModal(`<h3>${pl?'Paiement en plusieurs fois':'Nouveau paiement en plusieurs fois'}</h3>${top}${body}
 <div class="btns" style="margin-top:12px"><button class="ghost" data-a="closem">Annuler</button><button class="primary" data-a="saveplan">Enregistrer</button></div>
 ${pl?'<div style="margin-top:10px"><button class="danger" style="width:100%" data-a="delplan">Supprimer ce paiement</button></div>':''}`);
}
function savePlan(){
 const label=$('pl_lab').value.trim();if(!label){alert('Libellé manquant.');return;}
 const common={label,payee:$('pl_pay').value.trim(),acc:$('pl_acc')?$('pl_acc').value:defAcc(),cat:$('pl_cat').value,sub:$('pl_sub').value,match:$('pl_match').value.trim()};
 if(txCtx.pid){
  const pl=S.plans.find(x=>x.id===txCtx.pid);if(!pl)return;
  const lock=planKeys();
  const items=pl.items.map(x=>({date:x.date,amount:x.amount}));
  for(let i=0;i<items.length;i++){
   if(lock.has(pl.id+'|'+items[i].date))continue;
   const dEl=$('pi_d'+i),aEl=$('pi_a'+i);if(!dEl||!aEl)continue;
   const v=parseAmount(aEl.value);
   if(!(v>0)||!dEl.value){alert('Échéance '+(i+1)+' : date ou montant invalide.');return;}
   items[i]={date:dEl.value,amount:-Math.round(v*100)/100};
  }
  items.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  Object.assign(pl,common,{items});
 }else{
  const total=parseAmount($('pl_total').value),n=parseInt($('pl_n').value),start=$('pl_start').value;
  if(!(total>0)){alert('Montant total invalide.');return;}
  if(!(n>=2&&n<=60)){alert("Nombre d'échéances : entre 2 et 60.");return;}
  if(!start){alert('Date de la première échéance manquante.');return;}
  S.plans.push(Object.assign({id:uid(),items:makePlanItems(total,n,start)},common));
 }
 save();closeModal();render();
}
function openRec(id){
 const r=id?S.rec.find(x=>x.id===id):null;
 const d=r||{label:'',amount:-0.01,cat:'Logement',sub:'Loyer / crédit',freq:'monthly',day:new Date().getDate(),every:1,start:today(),end:'',match:''};
 const curAmt=r?amountAt(r,today()):d.amount;
 const dep=curAmt<=0;
 txCtx={rid:r?r.id:null,cur:curAmt};
 openModal(`<h3>${r?'Modifier la récurrence':'Nouvelle récurrence'}</h3>
 <label>Libellé<input id="r_lab" value="${esc(d.label)}"></label>
 ${accSelect('r_acc',d.acc||defAcc())}
 ${S.accounts.some(a=>a.type==='emprunt'||a.type==='credit')?`<label>Rembourse l'emprunt ou la carte (facultatif)<select id="r_loan"><option value="">— aucun —</option>${S.accounts.filter(a=>a.type==='emprunt'||a.type==='credit').map(a=>`<option value="${esc(a.id)}" ${d.loan===a.id?'selected':''}>${esc(accName(a.id))}</option>`).join('')}</select></label>`:''}
 <div class="seg"><label><input type="radio" name="rty" value="dep" ${dep?'checked':''}>Dépense</label><label><input type="radio" name="rty" value="rec" ${dep?'':'checked'}>Recette</label></div>
 <label>Montant habituel (€) — modifiable à chaque validation<input id="r_amt" inputmode="decimal" value="${r?String(Math.abs(curAmt)).replace('.',','):''}"></label>
 ${r?`<div id="r_fromw" style="display:none"><label>Nouveau montant applicable à partir du (inclus)<input id="r_from" type="date" value="${today()}"></label><p class="s" id="r_fromtxt" style="margin-top:-6px"></p></div>`:''}
 <label>Catégorie<select id="r_cat" data-catsel="r_sub">${catOptions(d.cat)}</select></label>
 <label>Sous-catégorie<select id="r_sub">${subOptions(d.cat,d.sub)}</select></label>
 <label>Fréquence<select id="r_freq"><option value="monthly" ${d.freq==='monthly'?'selected':''}>Mensuelle</option><option value="weekly" ${d.freq==='weekly'?'selected':''}>Hebdomadaire</option><option value="yearly" ${d.freq==='yearly'?'selected':''}>Annuelle</option><option value="days" ${d.freq==='days'?'selected':''}>Tous les N jours</option></select></label>
 <div id="r_dayw" style="display:${d.freq==='monthly'?'block':'none'}"><label>Jour du mois<input id="r_day" type="number" min="1" max="31" value="${d.day||1}"></label></div>
 <div id="r_everyw" style="display:${d.freq==='weekly'||d.freq==='days'?'block':'none'}"><label>Tous les N (semaines ou jours)<input id="r_every" type="number" min="1" value="${d.every||1}"></label></div>
 <label>Première échéance (date de départ)<input id="r_start" type="date" value="${esc(d.start)}"></label>
 <label>Fin (facultatif)<input id="r_end" type="date" value="${esc(d.end||'')}"></label>
 <label>Mot-clé pour reconnaître la ligne dans le CSV (facultatif)<input id="r_match" value="${esc(d.match||'')}" placeholder="ex. EDF"></label>
 <div class="btns"><button class="ghost" data-a="closem">Annuler</button><button class="primary" data-a="saverec">Enregistrer</button></div>
 ${r?'<div style="margin-top:10px"><button class="danger" style="width:100%" data-a="delrec">Supprimer cette récurrence</button></div>':''}`);
}
function fromInfo(){
 const f=$('r_from'),t=$('r_fromtxt');if(!f||!t||!f.value)return;
 const n=recAffected(txCtx.rid,f.value).length;
 t.textContent='Toutes les échéances du '+frDate(f.value)+' et suivantes passeront au nouveau montant'+(n?' ('+n+' déjà enregistrée(s) seront modifiées).':'.')+' Celles d\'avant gardent l\'ancien montant.';
}
function recAffected(id,from){return S.tx.filter(t=>t.recKey&&t.recKey.indexOf(id+'|')===0&&t.recKey.split('|')[1]>=from);}
function changeAmount(hist,cur,from,amt){
 const h=(hist&&hist.length?hist:[{from:'0000-01-01',amount:cur}]).filter(e=>e.from<from);
 if(!h.length)h.push({from:'0000-01-01',amount:cur});
 h.push({from,amount:amt});
 return h.sort((x,y)=>x.from<y.from?-1:x.from>y.from?1:0);
}
function saveRec(){
 const ty=document.querySelector('input[name=rty]:checked').value;
 const a=parseAmount($('r_amt').value);
 if(!(a>0)){alert('Montant invalide.');return;}
 const label=$('r_lab').value.trim();if(!label){alert('Libellé manquant.');return;}
 const start=$('r_start').value;if(!start){alert('Date de départ manquante.');return;}
 const freq=$('r_freq').value;
 const newAmt=Math.round((ty==='dep'?-a:a)*100)/100;
 const old=txCtx.rid?S.rec.find(x=>x.id===txCtx.rid):null;
 const r={id:txCtx.rid||uid(),label,amount:newAmt,acc:$('r_acc')?$('r_acc').value:(old?old.acc:defAcc()),loan:$('r_loan')?$('r_loan').value:(old&&old.loan||''),cat:$('r_cat').value,sub:$('r_sub').value,freq,day:parseInt($('r_day').value)||parseInt(start.slice(8)),every:Math.max(1,parseInt($('r_every').value)||1),start,end:$('r_end').value||'',match:$('r_match').value.trim()};
 if(freq==='monthly'&&!$('r_day').value)r.day=parseInt(start.slice(8));
 if(old&&old.hist)r.hist=old.hist;
 if(old&&Math.abs(newAmt-txCtx.cur)>0.004){
  const from=$('r_from')?$('r_from').value:'';
  if(!from){alert("Indique la date à partir de laquelle le nouveau montant s'applique.");return;}
  const affected=recAffected(old.id,from);
  if(affected.length&&!confirm(affected.length+' écriture(s) déjà enregistrée(s) à partir du '+frDate(from)+' passeront à '+fmt(newAmt)+'. Continuer ?'))return;
  r.hist=changeAmount(old.hist,txCtx.cur,from,newAmt);
  affected.forEach(t=>{t.amount=newAmt;});
  r.amount=amountAt(r,today());
 }
 if(txCtx.rid)S.rec[S.rec.findIndex(x=>x.id===txCtx.rid)]=r;else S.rec.push(r);
 save();closeModal();render();
}

/* ---------- actions ---------- */
async function exportJSON(){
 const json=JSON.stringify(S,null,1);const name='compte-'+today()+'.json';
 const file=new File([json],name,{type:'application/json'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});S.lastExport=today();save();render();return;}
 }catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
 S.lastExport=today();save();render();
}
function doImport(){
 const {ok}=impParse();
 const have={};
 S.tx.forEach(t=>{if(t.acc!==imp.acc)return;const k=t.date+'|'+t.amount.toFixed(2)+'|'+norm(t.label);have[k]=(have[k]||0)+1;});
 let added=0,dup=0,last='';
 ok.forEach(r=>{
  const k=r.date+'|'+r.amount.toFixed(2)+'|'+norm(r.label);
  if(have[k]>0){have[k]--;dup++;return;}
  const c=autoCat(r.label,r.amount,r.payee);
  const tx={id:uid(),date:r.date,label:r.label,amount:r.amount,cat:c.cat,sub:c.sub,payee:c.payee||'',acc:imp.acc};
  linkRec(tx);S.tx.push(tx);added++;if(r.date>last)last=r.date;
 });
 S.csvMaps[imp.sig]=Object.assign({},imp.map,{acc:imp.acc});save();
 imp=null;
 if(last){setAnchor(last);per='month';}
 view='tx';render();
 alert(added+' ligne(s) importée(s), '+dup+' doublon(s) ignoré(s).'+(added?' Corrige les lignes « Non classé » : l\'app retiendra tes choix.':''));
}
function onFile(text){
 const rows=parseCSV(text);
 if(rows.length<2){alert('Fichier vide ou illisible.');return;}
 const max=Math.max(...rows.slice(0,10).map(r=>r.length));
 const hi=rows.findIndex(r=>r.length===max);
 const header=rows[hi].map(x=>x.trim());
 const data=rows.slice(hi+1).filter(r=>r.length>=Math.min(3,max));
 const sig=header.join('|');
 let map=S.csvMaps[sig];
 if(!map){
  const d=guessCol(header,/date/i),l=guessCol(header,/libell|label|descr|d[ée]tail|objet|intitul/i);
  const a=guessCol(header,/montant|amount|somme/i),db=guessCol(header,/d[ée]bit/i),cr=guessCol(header,/cr[ée]dit/i);
  let py=guessCol(header,/tiers|b[ée]n[ée]ficiaire|payee|commer[cç]ant|marchand|merchant|contrepartie|[ée]metteur|nom/i);if(py===l||py===d)py=-1;
  map={date:d,label:l,payee:py,amount:a,debit:db,credit:cr,mode:(a<0&&db>=0&&cr>=0)?'split':'single'};
 }
 if(map.payee===undefined){const l=map.label,d=map.date;let py=guessCol(header,/tiers|b[ée]n[ée]ficiaire|payee|commer[cç]ant|marchand|merchant|contrepartie|[ée]metteur|nom/i);if(py===l||py===d)py=-1;map=Object.assign({},map,{payee:py});}
 imp={header,data,sig,map,acc:(map.acc&&accById(map.acc))?map.acc:defAcc()};render();
}
function act(a,ds){
 if(a==='nav'){sel=null;view=ds.v;window.scrollTo(0,0);render();}
 else if(a==='prev'){shiftPeriod(-1);pruneSel();render();}
 else if(a==='next'){shiftPeriod(1);pruneSel();render();}
 else if(a==='per'){per=ds.p;month=monthOf(anchor);pruneSel();render();}
 else if(a==='gotoday'){setAnchor(today());pruneSel();render();}
 else if(a==='gomonth'){per='month';setAnchor(ds.d);pruneSel();render();}
 else if(a==='goday'){per='day';setAnchor(ds.d);pruneSel();render();}
 else if(a==='negbal'){const i=$('ac_bal');if(i){const v=i.value.trim();i.value=v.startsWith('-')?v.slice(1):(v?'-'+v:'-');}}
 else if(a==='newtx')openTx(null);
 else if(a==='togacc'){const i=S.shown.indexOf(ds.id);if(i>=0)S.shown.splice(i,1);else S.shown.push(ds.id);save();pruneSel();render();}
 else if(a==='newxfer')openXfer();
 else if(a==='savexfer')saveXfer();
 else if(a==='newacc')openAcc(null);
 else if(a==='editacc')openAcc(ds.id);
 else if(a==='saveacc')saveAcc();
 else if(a==='delacc')delAcc();
 else if(a==='unlink'){if(txCtx.xfer&&confirm('Délier ce virement ? Les deux lignes redeviennent des opérations normales, à catégoriser.')){unlinkTransfer(txCtx.xfer);save();closeModal();render();}}
 else if(a==='selstart'){sel=new Set();render();}
 else if(a==='selend'){sel=null;render();}
 else if(a==='togsel'){if(sel){if(sel.has(ds.id))sel.delete(ds.id);else sel.add(ds.id);refreshList();}}
 else if(a==='selall'){if(sel){const ids=filteredTx().items.filter(t=>!t.virtual).map(t=>t.id);if(ids.length&&ids.every(id=>sel.has(id)))sel=new Set();else sel=new Set(ids);refreshList();}}
 else if(a==='bulk')openBulk();
 else if(a==='applybulk')applyBulk();
 else if(a==='delbulk'){if(sel&&confirm('Supprimer '+sel.size+' ligne(s) ? Action irréversible.')){const px=new Set(S.tx.filter(x=>sel.has(x.id)&&x.xfer).map(x=>x.xfer));S.tx=S.tx.filter(x=>!sel.has(x.id)&&!(x.xfer&&px.has(x.xfer)));sel=null;save();closeModal();render();}}
 else if(a==='edittx')openTx(ds.id);
 else if(a==='newrec')openRec(null);
 else if(a==='newplan')openPlan(null);
 else if(a==='editplan')openPlan(ds.id);
 else if(a==='saveplan')savePlan();
 else if(a==='delplan'){if(confirm('Supprimer ce paiement en plusieurs fois ? Les échéances déjà enregistrées sont conservées.')){S.plans=S.plans.filter(x=>x.id!==txCtx.pid);save();closeModal();render();}}
 else if(a==='editrec')openRec(ds.id);
 else if(a==='closem')closeModal();
 else if(a==='savetx')saveTx();
 else if(a==='saverec')saveRec();
 else if(a==='deltx'){const t=S.tx.find(x=>x.id===txCtx.id);const isX=!!(t&&t.xfer);if(confirm(isX?'Supprimer ce virement ? Les deux lignes (les deux comptes) seront supprimées.':'Supprimer cette ligne ?')){S.tx=S.tx.filter(x=>isX?x.xfer!==t.xfer:x.id!==txCtx.id);save();closeModal();render();}}
 else if(a==='delrec'){if(confirm('Supprimer cette récurrence ? Les lignes déjà validées sont conservées.')){S.rec=S.rec.filter(x=>x.id!==txCtx.rid);save();closeModal();render();}}
 else if(a==='validate'){const it=dueRange(range().from,range().to).find(x=>x.k===ds.k);if(it)openTx(null,{date:it.d,label:it.r.label,amount:it.amount,cat:it.r.cat,sub:it.r.sub,acc:it.r.acc,payee:it.r.payee||'',xacc:it.r.loan||''},it.k);}
 else if(a==='skip'){S.skips.push(ds.k);save();render();}
 else if(a==='export')exportJSON();
 else if(a==='impcancel'){imp=null;render();}
 else if(a==='doimport')doImport();
 else if(a==='delrule'){S.rules=S.rules.filter(r=>r.kw!==ds.kw);save();render();}
 else if(a==='delbudget'){delete S.budgets[ds.key];save();render();}
 else if(a==='addbudget'){const v=parseAmount($('b_amt').value);if(!(v>0)){alert('Montant invalide.');return;}S.budgets[$('b_key').value]=v;save();render();}
 else if(a==='wipe'){if(confirm('Effacer toutes les données ?')&&confirm('Dernière confirmation : action irréversible.')){S=defaultState();save();render();}}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el){if(el.tagName==='LABEL')return;act(el.dataset.a,el.dataset);}});
document.addEventListener('input',e=>{if(e.target.id==='s'){search=e.target.value;pruneSel();refreshList();}else if(e.target.id==='r_amt'){const w=$('r_fromw');if(w)w.style.display='block';fromInfo();}else if(e.target.id==='r_from')fromInfo();});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.catsel){$(t.dataset.catsel).innerHTML=subOptions(t.value,'');}
 else if(t.name==='ty'||t.name==='rty'){
  const p=t.name==='ty'?'f_':'r_';const c=$(p+'cat');if(t.name==='rty'&&$('r_fromw'))$('r_fromw').style.display='block';
  if(t.value==='rec'&&c.value!=='Revenus'){c.value='Revenus';$(p+'sub').innerHTML=subOptions('Revenus','');}
  if(t.value==='dep'&&c.value==='Revenus'){c.value='Divers';$(p+'sub').innerHTML=subOptions('Divers','Non classé');}
 }
 else if(t.id==='r_freq'){$('r_dayw').style.display=t.value==='monthly'?'block':'none';$('r_everyw').style.display=(t.value==='weekly'||t.value==='days')?'block':'none';}
 else if(t.id==='csv'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{let txt=rd.result;onFile(txt);};rd.readAsText(t.files[0],'utf-8');}
 else if(t.id==='jsonfile'&&t.files[0]){
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.tx))throw 0;if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S=migrate(o);save();render();}}catch(x){alert('Fichier de sauvegarde invalide.');}};
  rd.readAsText(t.files[0]);
 }
 else if(t.dataset&&t.dataset.imp){imp.map[t.dataset.imp]=parseInt(t.value);render();}
 else if(t.name==='mode'){imp.map.mode=t.value;render();}
 else if(t.id==='fcat'){fcat=t.value;pruneSel();render();}
 else if(t.id==='funcl'){funcl=t.checked;pruneSel();render();}
 else if(t.id==='r_start'&&$('r_day')&&$('r_freq').value==='monthly'){const dd=parseInt(t.value.slice(8));if(dd)$('r_day').value=dd;}
 else if(t.id==='imp_acc'){imp.acc=t.value;}
 else if(t.id==='ac_type'&&!txCtx.aid){$('ac_cash').checked=(t.value==='courant'||t.value==='differe');}
 if(t.id==='ac_type'&&$('ac_limw'))$('ac_limw').style.display=t.value==='credit'?'block':'none';
 if(t.id==='ac_type'&&$('ac_difw'))$('ac_difw').style.display=t.value==='differe'?'block':'none';
});

/* ---------- démarrage ---------- */
if(typeof document!=='undefined'&&document.getElementById('app')){
 if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(ok=>{persisted=ok;}).catch(()=>{});}
 if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
 render();
}
</script>
