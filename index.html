<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Compte">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mon Compte</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri2:#ccfbf1;--red:#dc2626;--grn:#15803d;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--line:#1f2a40;--pri:#2dd4bf;--pri2:#0f3d3a;--red:#f87171;--grn:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 32px) 14px calc(90px + env(safe-area-inset-bottom))}
h2{margin:6px 0 10px;font-size:22px}
h3{margin:0 0 10px}
.mut{color:var(--mut)}
.s{font-size:12px;color:var(--mut)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.grid .card{margin:0;display:flex;flex-direction:column;justify-content:space-between}   /* libellé en haut, montant en bas : les montants de deux cartes voisines restent alignés même si un libellé passe sur deux lignes */
.big{font-size:clamp(17px,5.6vw,22px);font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.neg{color:var(--red)}.pos{color:var(--grn)}
.warn{border-left:4px solid var(--warn)}
.pseg{display:flex;gap:6px;margin:4px 0 8px}.pseg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 2px;font-size:14px}.pseg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.mnav b{text-align:center}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.mnav button{border:0;background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:12px;font-size:22px}
button,.btn{font:inherit}
.btn,.primary{display:inline-block;border:0;background:var(--pri);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;text-align:center}
@media(prefers-color-scheme:dark){.btn,.primary{color:#04201e}}
.ghost{border:1px solid var(--line);background:transparent;color:var(--tx);padding:12px 16px;border-radius:12px}
.danger{border:1px solid var(--red);background:transparent;color:var(--red);padding:12px 16px;border-radius:12px}
.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .d{width:42px;color:var(--mut);font-size:13px}
.row .m{flex:1;min-width:0}
.row .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right}
.pa-mv{display:flex;gap:4px;flex:none}
.pa-mv button{width:40px;min-height:40px;padding:0;font-size:14px}
.row.pa-fl{flex-wrap:wrap}
.pa-sum{flex:0 0 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.pa-sum b{font-size:14px;overflow-wrap:anywhere}
input,select{font:inherit;font-size:16px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mut)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--tx)}
.seg input{width:auto;margin:0 6px 0 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.over{background:var(--red)}
details{border-bottom:1px solid var(--line);padding:8px 0}
details:last-child{border-bottom:0}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.fold>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;min-height:24px}
.fold>summary::after{content:'▾';color:var(--mut);transition:transform .15s}
.fold:not([open])>summary::after{transform:rotate(-90deg)}
.fold[open]>summary{margin-bottom:6px}
.fold.grp{margin:14px 0 2px}
.fold.grp>summary{font-weight:600}
.fold.grp>summary .s{margin-left:auto}
.sr{display:flex;justify-content:space-between;font-weight:600}
.sub{display:flex;justify-content:space-between;padding:4px 0 0 12px;color:var(--mut);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 2px;font-size:12px}
nav button.on{color:var(--pri);font-weight:700}
#offbar{position:fixed;left:0;right:0;bottom:var(--navh,56px);min-height:28px;line-height:1.25;padding:4px 10px;text-align:center;font-size:13px;overflow-wrap:anywhere;background:#fef3c7;color:#92400e;border-top:1px solid #fcd34d;z-index:9;pointer-events:none}
#offbar[hidden]{display:none}
@media(prefers-color-scheme:dark){#offbar{background:#3b2f0b;color:#fcd34d;border-color:#78591a}}
body.off #app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body.off .fab{bottom:calc(104px + env(safe-area-inset-bottom))}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
/* iPhone : les champs date de Safari ont une largeur propre qui débordait de la fenêtre (iPhone 16e) */
.sheet{overflow-x:hidden}
.sheet label{display:block;min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left}
.bud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;text-align:center}
.bud>*{min-width:0}
.bud .bv{font-size:clamp(13px,4.3vw,18px);font-weight:700;margin-top:2px;overflow-wrap:anywhere}
/* Bulletin de paye : sélecteurs de mois (deux listes, pas de champ month de Safari) et tableau sans défilement horizontal */
.pk{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px}
.pk select,.pk2 select,.pk2 input{min-width:0}
.pbx{display:flex;align-items:center;padding:6px 0;color:var(--tx)}
.pbx input{width:auto;margin:0 10px 0 0}
.pk2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pa-x{border:1px solid var(--line);border-radius:10px;padding:8px 8px 0;margin-bottom:8px}
table.pa{table-layout:fixed;font-size:12px}
table.pa th.l,table.pa td.l{width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.pa th.n,table.pa td.n{text-align:right;white-space:nowrap;padding-left:2px;padding-right:2px}
table.pa th{color:var(--mut);font-weight:600}
table.pa td.chg{font-weight:700;color:var(--pri)}
table.pa td.grp{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;padding-top:10px;border-bottom:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<nav>
<button data-a="nav" data-v="home">Accueil</button>
<button data-a="nav" data-v="tx">Lignes</button>
<button data-a="nav" data-v="rec">Récurrent</button>
<button data-a="nav" data-v="imp">Import</button>
<button data-a="nav" data-v="set">Réglages</button>
</nav>
<div id="offbar" role="status" aria-live="polite" hidden>Hors ligne : tes modifications sont gardées sur cet appareil</div>
<script>
const KEY='compte-salaire-v1';
/* Épargne bloquée et Bien : comptent dans le patrimoine net seulement. Jamais dans le reste à vivre, le budget du jour, les soldes des comptes cochés ni « Sortir du découvert », et on n'y saisit pas de lignes : on met à jour leur valeur (solde de référence). */
const ILLIQ={bloque:1,bien:1};
const isLiquid=a=>!ILLIQ[a.type];
const APP_VERSION='60';   // identique au numéro de la constante V de sw.js (compte-v60) : à incrémenter ensemble à chaque livraison
const CATS={
 'Revenus':['Salaire','Primes','Remboursements','Intérêts','Autres revenus'],
 'Logement':['Loyer / crédit','Charges','Énergie','Internet / téléphone','Assurance habitation','Travaux / mobilier'],
 'Voiture':['Carburant','Assurance','Entretien / réparations','Péage / parking','Crédit / leasing'],
 'Alimentation':['Courses'],
 'Santé':['Mutuelle','Pharmacie / médecin'],
 'Animaux':['Alimentation','Vétérinaire / pharmacie','Assurance / mutuelle','Toilettage / garde','Accessoires / jouets'],
 'Loisirs':['Restaurants / bars','Sorties','Abonnements','Voyages / vacances','Shopping'],
 'Finances':['Épargne','Impôts','Frais bancaires','Crédits'],
 'Divers':['Cadeaux','Imprévus','Retrait d\'espèces','Non classé']
};
const RK='Loisirs|Restaurants / bars';
const defaultState=()=>({v:2,accounts:[{id:'a1',name:'Compte salaire',type:'courant',opening:0,cash:true}],shown:['a1'],tx:[],rec:[],plans:[],rules:[],budgets:{},payDates:{},csvMaps:{},skips:[],paie:{lines:[],slips:{},skips:[]},lastExport:null,bk:{since:null,snooze:null,every:7}});
/* Rappel de sauvegarde (partagé entre appareils, clé « bk » de la ligne meta) : since = date de la première modification non sauvegardée,
   snooze = rappel reporté jusqu'à cette date, every = délai en jours (0 = jamais). Le rappel n'apparaît que s'il y a des modifications non sauvegardées. */
const BK_EVERY=[0,3,7,14,30],BK_DEFAULT=7;
const bkIsDay=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
function bkToday(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}   // fonction (pas const) : migrate() s'exécute avant les const plus bas
function normBk(b){b=b&&typeof b==='object'?b:{};return{since:bkIsDay(b.since)?b.since:null,snooze:bkIsDay(b.snooze)?b.snooze:null,every:BK_EVERY.includes(b.every)?b.every:BK_DEFAULT};}
/* Tiers toujours en majuscules (espaces nettoyés) : « Leclerc » et « LECLERC » ne font plus deux tiers. */
function upP(s){return String(s==null?'':s).trim().replace(/\s+/g,' ').toLocaleUpperCase('fr-FR');}
let payFixed=false;   // vrai si migrate() a changé des tiers : l'enregistrement se fait au démarrage (voir le bloc démarrage)
function migrate(raw){
 const hadBk=!!(raw&&raw.bk&&typeof raw.bk==='object');
 const o=Object.assign(defaultState(),raw||{});
 o.bk=normBk(hadBk?o.bk:null);
 if(raw&&!hadBk&&Array.isArray(o.tx)&&o.tx.length&&!o.lastExport)o.bk.since=bkToday();   // données d'avant le rappel, jamais exportées : le compte commence aujourd'hui
 if(!raw||!Array.isArray(raw.accounts)||!raw.accounts.length){o.accounts=[{id:'a1',name:'Compte salaire',type:'courant',opening:(raw&&raw.opening)||0,cash:true}];o.shown=['a1'];}
 const first=o.accounts[0].id;
 o.accounts.forEach(a=>{if(a.type==='paypal')a.type='courant';});
 o.tx.forEach(t=>{if(!t.acc)t.acc=first;});
 o.rec.forEach(r=>{if(!r.acc)r.acc=first;});
 [o.tx,o.rec,o.plans,o.rules].forEach(l=>(l||[]).forEach(x=>{if(x&&x.payee){const u=upP(x.payee);if(u!==x.payee){x.payee=u;payFixed=true;}}}));
 if(!Array.isArray(o.shown))o.shown=o.accounts.map(a=>a.id);
 o.shown=o.shown.filter(id=>o.accounts.some(a=>a.id===id&&!ILLIQ[a.type]));
 o.accounts.forEach(a=>{
  if(!a.anchor&&Math.abs(a.opening||0)>=0.005){
   const ds=o.tx.filter(x=>x.acc===a.id).map(x=>x.date),t=ds.length?ds.reduce((m,x)=>x<m?x:m):ymd(new Date());
   a.anchor={date:t,amount:Math.round(((a.opening||0)+o.tx.filter(x=>x.acc===a.id&&x.date<=t).reduce((s,x)=>s+x.amount,0))*100)/100};
  }
  if(a.anchor){a.adj=Math.round((a.anchor.amount-o.tx.filter(x=>x.acc===a.id&&x.date<=a.anchor.date).reduce((s,x)=>s+x.amount,0))*100)/100;a.opening=0;}
 });
 if(!o.payDates||typeof o.payDates!=='object'||Array.isArray(o.payDates))o.payDates={};
 if(!o.paie||typeof o.paie!=='object'||Array.isArray(o.paie))o.paie={};
 if(!Array.isArray(o.paie.lines))o.paie.lines=[];
 if(!o.paie.slips||typeof o.paie.slips!=='object'||Array.isArray(o.paie.slips))o.paie.slips={};
 if(!Array.isArray(o.paie.skips))o.paie.skips=[];
 for(const k of ['pt','acf']){   // pt : point d'indice ; acf : point ACF (valeurs annuelles datées)
  if(!o.paie[k]||typeof o.paie[k]!=='object'||Array.isArray(o.paie[k]))o.paie[k]={amount:0,hist:[]};
  if(!Array.isArray(o.paie[k].hist))o.paie[k].hist=[];
  if(typeof o.paie[k].amount!=='number'||isNaN(o.paie[k].amount))o.paie[k].amount=0;
 }
 o.paie.lines.forEach(l=>{
  if(!['fixed','points','acf','rate'].includes(l.mode))l.mode='fixed';
  if(l.mode==='rate'){
   if(!Array.isArray(l.base))l.base=[];
   if(typeof l.coef!=='number'||isNaN(l.coef))l.coef=100;
   if(l.cap&&!(l.cap.line&&typeof l.cap.pct==='number'))delete l.cap;
  }else{delete l.base;delete l.coef;delete l.cap;}
 });
 delete o.opening;o.v=2;return o;
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}return migrate(null);}
let S=load();
function reanchor(){
 S.accounts.forEach(a=>{if(a.anchor){a.adj=Math.round((a.anchor.amount-S.tx.filter(t=>t.acc===a.id&&t.date<=a.anchor.date).reduce((s,t)=>s+t.amount,0))*100)/100;a.opening=0;}});
}
function save(quiet){reanchor();if(!quiet){if(!S.bk)S.bk=normBk(null);if(!S.bk.since)S.bk.since=bkToday();}try{localStorage.setItem(KEY,JSON.stringify(S));syncTouch();}catch(e){alert("Impossible d'enregistrer : stockage plein ou bloqué.");}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const monthOf=d=>d.slice(0,7);
function addMonths(m,k){let [y,mm]=m.split('-').map(Number);mm+=k-1;y+=Math.floor(mm/12);mm=((mm%12)+12)%12;return y+'-'+pad(mm+1);}
const monthLabel=m=>{const [y,mm]=m.split('-').map(Number);const s=new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);};
const dim=(y,m)=>new Date(y,m,0).getDate();
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const frDate=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);

/* ---------- logique ---------- */
function sortedTx(){return S.tx.map((t,i)=>[t,i]).sort((a,b)=>a[0].date<b[0].date?-1:a[0].date>b[0].date?1:a[1]-b[1]).map(x=>x[0]);}
const ACC_TYPES={courant:'Compte courant',livret:'Livret',credit:'Carte de crédit',differe:'Carte bancaire à débit différé',emprunt:'Emprunt',bloque:'Épargne bloquée (parts sociales, assurance-vie…)',bien:'Bien (maison, véhicule…) à valeur estimée'};
const liqAccs=()=>S.accounts.filter(isLiquid);
/* Carte de crédit : le solde est le montant encore DISPONIBLE ; la dette est la différence avec le plafond (plafond 3000, solde 2500 : dû 500). Solde négatif = plafond dépassé. */
const creditInfo=a=>{const bal=accBalance(a.id,today()),lim=a.limit||0;return{lim,due:Math.max(0,Math.round((lim-bal)*100)/100),avail:bal};};
const accById=id=>S.accounts.find(a=>a.id===id);
const accName=id=>{const a=accById(id);return a?(a.group?a.group+' · ':'')+a.name:'?';};
const groupOpts=()=>[...new Set(S.accounts.map(a=>a.group).filter(Boolean))].sort().map(g=>`<option value="${esc(g)}">`).join('');
const inScope=t=>{const a=accById(t.acc);return S.shown.includes(t.acc)&&(!a||isLiquid(a));};
function defAcc(){return S.shown[0]||(liqAccs()[0]||S.accounts[0]).id;}
function scopeAccs(cashOnly){return S.accounts.filter(a=>isLiquid(a)&&S.shown.includes(a.id)&&(!cashOnly||a.cash));}
/* Dans tout total (solde des comptes cochés, reste à vivre, solde courant des lignes), une carte de crédit pèse sa dette : solde (disponible) − plafond, soit −500 pour un plafond de 3000 et un disponible de 2500 */
function openingSum(cashOnly){return scopeAccs(cashOnly).reduce((s,a)=>s+(a.opening||0)-(a.type==='credit'?(a.limit||0):0),0);}
function balanceAt(date,cashOnly){const ids=new Set(scopeAccs(cashOnly).map(a=>a.id));return openingSum(cashOnly)+scopeAccs(cashOnly).reduce((s,a)=>s+(a.anchor&&a.anchor.date<=date?(a.adj||0):0),0)+S.tx.filter(t=>ids.has(t.acc)&&t.date<=date).reduce((s,t)=>s+t.amount,0);}
function accBalance(id,date){const a=accById(id);return ((a&&a.opening)||0)+(a&&a.anchor&&(!date||a.anchor.date<=date)?(a.adj||0):0)+S.tx.filter(t=>t.acc===id&&(!date||t.date<=date)).reduce((s,t)=>s+t.amount,0);}
function adjRows(){
 return scopeAccs(false).filter(a=>a.anchor&&Math.abs(a.adj||0)>=0.005).map(a=>({id:'adj_'+a.id,virtual:true,date:a.anchor.date,label:'Ajustement de solde',amount:a.adj,cat:'Ajustement',sub:'Solde de référence',payee:'',acc:a.id}));
}
function withBalance(){
 let b=openingSum(false);
 const rows=sortedTx().filter(inScope);
 return adjRows().map(r=>[r,-1]).concat(rows.map((t,i)=>[t,i])).sort((x,y)=>x[0].date<y[0].date?-1:x[0].date>y[0].date?1:x[1]-y[1]).map(x=>x[0]).map(t=>{b+=t.amount;return Object.assign({},t,{bal:b});});
}
function xferOther(t){return t.xfer?S.tx.find(x=>x.xfer===t.xfer&&x.id!==t.id):null;}
function createTransfer(from,to,amt,date,label){
 const pid=uid();
 S.tx.push({id:uid(),date,label,amount:-amt,cat:'Virement',sub:'Entre comptes',payee:'',acc:from,xfer:pid},{id:uid(),date,label,amount:amt,cat:'Virement',sub:'Entre comptes',payee:'',acc:to,xfer:pid});
 return pid;
}
function linkTransfer(t,otherAcc){
 const pid=uid();
 const loan=((accById(otherAcc)||{}).type==='emprunt')&&t.amount<0;
 const sub=loan?'Remboursement':'Entre comptes';
 const cand=S.tx.find(x=>x.acc===otherAcc&&!x.xfer&&x.id!==t.id&&Math.abs(x.amount+t.amount)<0.005&&Math.abs((new Date(x.date+'T12:00:00')-new Date(t.date+'T12:00:00'))/86400000)<=5);
 t.xfer=pid;
 if(loan)t.cnt=true;else{t.cat='Virement';t.sub='Entre comptes';}
 if(cand){cand.xfer=pid;cand.cat='Virement';cand.sub=sub;return 'lié';}
 S.tx.push({id:uid(),date:t.date,label:t.label,amount:-t.amount,cat:'Virement',sub,payee:'',acc:otherAcc,xfer:pid});
 return 'créé';
}
function unlinkTransfer(pid){
 const legs=S.tx.filter(x=>x.xfer===pid);
 if(legs.some(x=>x.cnt)){
  S.tx=S.tx.filter(x=>!(x.xfer===pid&&!x.cnt));
  legs.filter(x=>x.cnt).forEach(x=>{delete x.xfer;delete x.cnt;});
  return;
 }

function occ(r,m){

 else if(r.freq==='yearly'){const sp=start.split('-').map(Number);if(sp[1]===mm)add(y+'-'+pad(mm)+'-'+pad(Math.min(sp[2],last)));}
 else{
  const step=r.freq==='weekly'?7*(r.every||1):(r.every||1);
  const s=new Date(start+'T12:00:00');
  for(let d=1;d<=last;d++){const cur=new Date(y,mm-1,d,12);const diff=Math.round((cur-s)/86400000);if(diff>=0&&diff%step===0)add(ymd(cur));}

function parseCSV(text){

 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;
  else if(c===sep){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
  else cur+=c;

}

}

function patrimoine(now){

}

/* ---------- Budget du jour (façon Money Coach) ----------
   Période = de jour de paie à la veille du suivant. Budget = reste à vivre d'aujourd'hui (comptes cochés ET « reste à vivre »)
   + échéances à venir de la période (non validées, hors prélèvements de débit différé déjà comptés), réparti sur les jours restants

const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);

 while(!isWorkday(d))d=addDays(d,-1);

const payDate=ym=>(S.payDates&&S.payDates[ym])||payRule(ym);

 const upSum=dueRange(cyc.from,cyc.to).filter(x=>!x.noproj&&ids.has(x.r.acc)).reduce((s,x)=>s+x.amount,0);

}

/* ---------- Découvert autorisé et plafonds de carte (compte courant) ----------
   Règle donnée par l'utilisateur (carte à débit différé, 2000 de découvert, 1500 de plafond) : tant que le découvert n'est pas atteint, le disponible par carte est le plafond de
   paiement restant ; au-delà, c'est le plafond restant MOINS le dépassement (1500 − 495,18 = 1004,82), jamais négatif. Sans plafond saisi : la marge du compte (solde + découvert).
   Retrait : plafond de retrait restant, non réduit par le dépassement (c'est ce qu'affiche l'appli de sa banque ; à confirmer en pratique).
   Plafond utilisé = lignes de paiement de la fenêtre glissante + achats d'une carte à débit différé rattachée qui ne sont pas détaillés en lignes
   (solde en attente de la carte − lignes détaillées depuis le dernier prélèvement).
   Le découvert n'entre JAMAIS dans le budget du jour ni dans le reste à vivre : c'est une limite à ne pas atteindre. */
const RETRAIT="Retrait d'espèces";
function cardInfo(a,now){
 const r2=n=>Math.round(n*100)/100,od=a.od||0,bal=accBalance(a.id,now),margin=r2(bal+od);
 const diff=S.accounts.filter(x=>x.type==='differe'&&x.debitAcc===a.id);
 const ids=new Set([a.id].concat(diff.map(x=>x.id)));
 const lines=S.tx.filter(t=>ids.has(t.acc)&&t.amount<0&&!t.xfer&&!t.recKey);
 /* achats en attente sur une carte à débit différé non détaillés en lignes (ex. solde de référence saisi sans le détail) */
 const undetailed=diff.reduce((s,d)=>{const since=debitDates(d,now).last,pending=Math.max(0,-accBalance(d.id,now)),detailed=-lines.filter(t=>t.acc===d.id&&t.date>since&&t.date<=now).reduce((q,t)=>q+t.amount,0);return s+Math.max(0,r2(pending-detailed));},0);
 const spent=(days,wd)=>r2(-lines.filter(t=>t.date>addDays(now,-days)&&t.date<=now&&((t.sub===RETRAIT)===wd)).reduce((s,t)=>s+t.amount,0)+(wd?0:undetailed));
 const mk=(lim,days,wd)=>lim?{lim,days,spent:spent(days,wd),left:Math.max(0,r2(lim-spent(days,wd)))}:null;
 const pay=mk(a.payLim,a.payDays||30,false),wd=mk(a.wdLim,a.wdDays||7,true);
 const availBank=Math.max(0,margin),over=margin<0?-margin:0;
 const cyc=payCycle(now);let run=bal,min=bal,minDate=now;
 dueRange(cyc.from,cyc.to).filter(x=>x.r.acc===a.id).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0).forEach(x=>{run=r2(run+x.amount);if(run<min){min=run;minDate=x.d<now?now:x.d;}});
 return{od,bal,margin,over,pay,wd,undetailed,availBank,availCard:pay?Math.max(0,r2(pay.left-over)):availBank,availCash:wd?wd.left:availBank,
  end:run,min,minDate,projOver:min+od<-0.005,to:cyc.to};
}

/* ---------- Bulletin de paye : suivi de l'évolution de chaque ligne (module à part) ----------
   Aucun lien avec les comptes ni les lignes : ni solde, ni reste à vivre, ni budget du jour, ni patrimoine.
   S.paie = { lines: modèle (lignes qui se répètent chaque mois, montants datés), slips: fiches validées {'AAAA-MM':{rows}}, skips: mois ignorés }. */
const PA_KINDS={gain:'Gain',ret:'Retenue',tot:'Total / information'};
const PA_RANK={gain:0,ret:1,tot:2};
const PA_MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let paWin=0,paSel='',paPt=-1,paSelM=null,paSelL=null,paSelK=null;   // paSelK : idem pour les mois ignorés (remise à valider) ; paSelM : null = hors sélection, sinon ensemble des mois cochés (suppression de fiches) ; paSelL : idem pour les lignes du modèle
const paFmt=n=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const paR2=n=>Math.round(n*100)/100;
/* Points : le montant est tronqué au centime (jamais arrondi), comme sur les bulletins DGFiP (5 623,23 × 328 points → 1 537,01 et non 1 537,02). Calcul en centimes, avec une tolérance pour les erreurs de virgule flottante. */
const paTrunc=n=>Math.floor(Math.round(n*1e6)/1e6)/100;
/* Points ACF : montant arrondi normalement au centime (fiche réelle : 22 points × 55,05 ÷ 12 = 100,925 payé 100,93). Calcul en centimes avec tolérance flottante. */
const paRnd=n=>Math.round(Math.round(n*1e6)/1e6)/100;
const paNum=n=>String(n).replace('.',',');
function paAmt(l,ym){
 if(!l.hist||!l.hist.length)return l.amount;
 let v=l.hist[0].amount;
 for(const e of l.hist){if(e.from<=ym)v=e.amount;}
 return v;
}
const paActive=(l,ym)=>ym>=l.start&&(!l.end||ym<=l.end);
function paDue(){
 const L=S.paie.lines;if(!L.length)return[];
 const first=L.reduce((m,l)=>l.start<m?l.start:m,L[0].start),cur=monthOf(today());
 const out=[];
 for(let m=first,n=0;m<=cur&&n<600;m=addMonths(m,1),n++){
  if(S.paie.slips[m]||S.paie.skips.includes(m))continue;
  if(L.some(l=>paActive(l,m)))out.push(m);
 }
 return out;
}
const paSlipMonths=()=>Object.keys(S.paie.slips).sort();
/* Calcul des lignes : fixe = montant saisi ; points = points × valeur annuelle (indice 100) ÷ 100 ÷ 12, tronqué au centime ; taux = taux % × base, la base étant la somme des lignes cochées, les retenues cochées étant retranchées (ex. transfert primes/points), plus les lignes ponctuelles « soumises aux taux » de la fiche si la ligne à taux l'accepte (xp) (plafonnée à x % d'une autre ligne, puis multipliée par un coefficient). ov = montants imposés (saisis à la main) ; les références circulaires comptent 0 (elles sont refusées à la saisie). */
/* Période payée d'un mois (proratisation) : jours du d au f, base 30 jours ; le dernier jour du mois compte pour le 30. 0 = période invalide. */
const paDim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
function paDays(ym,d,f){const dim=paDim(ym);d=d||1;f=f||dim;if(d<1||f>dim||d>f)return 0;return Math.max(1,Math.min(30,(f>=dim?30:f)-Math.min(d,30)+1));}
const paQ=(ym,pr)=>pr?Math.min(1,paDays(ym,pr.d,pr.f)/30):1;
function paCompute(ym,ov,xs,q){
 ov=ov||{};xs=xs||[];q=q===undefined?1:q;const L=S.paie.lines,by=Object.fromEntries(L.map(l=>[l.id,l])),memo={},busy={};
 const get=id=>{
  if(id in memo)return memo[id];
  const l=by[id];if(!l||busy[id])return 0;
  if(ov[id]!==undefined)return memo[id]=ov[id];
  busy[id]=1;let v;const mode=l.mode||'fixed';
  if(mode==='points')v=paTrunc(paAmt(S.paie.pt,ym)*paAmt(l,ym)/12*q);   // proratisé avant de tronquer (328 pts × 2/3 → 1024,67)
  else if(mode==='acf')v=paRnd(paAmt(S.paie.acf,ym)*paAmt(l,ym)*100/12*q);
  else if(mode==='rate'){
   let b=(l.base||[]).reduce((t,i)=>by[i]&&paActive(by[i],ym)?t+(by[i].kind==='ret'?-1:1)*get(i):t,0);
   if(l.xp)b+=xs.reduce((t,x)=>t+(x.kind==='ret'?-1:1)*x.amount,0);   // lignes ponctuelles cochées « soumise aux taux » (gain ajouté, retenue retranchée)
   if(l.cap&&by[l.cap.line])b=Math.min(b,get(l.cap.line)*l.cap.pct/100);
   b=b*(l.coef===undefined?100:l.coef)/100;
   v=paR2(b*paAmt(l,ym)/100);
  }else v=q<1?paR2(paAmt(l,ym)*q):paAmt(l,ym);   // ligne fixe proratisée ; les lignes à taux suivent leur base
  busy[id]=0;return memo[id]=v;
 };
 L.forEach(l=>get(l.id));return memo;

function paFormQ(){const d=$('pa_d'),f=$('pa_f');if(!d||!f)return 1;const n=paDays(txCtx.pm,parseInt(d.value,10)||0,parseInt(f.value,10)||0);return n?Math.min(1,n/30):1;}
/* Changement de période : les lignes fixes encore au montant du modèle × ancienne quotité suivent la nouvelle quotité (un montant saisi à la main n'est pas touché) ; les lignes calculées se recalculent. */
function paPeriod(){
 const ym=txCtx.pm,box=$('pa_q'),n=paDays(ym,parseInt($('pa_d').value,10)||0,parseInt($('pa_f').value,10)||0);
 if(!n){box.textContent='Période invalide : jours entre 1 et '+paDim(ym)+', début avant fin.';return;}
 const q=Math.min(1,n/30),qo=Number(box.dataset.q);
 box.textContent=n<30?n+' jours sur 30 · lignes fixes, points et ACF proratisés':'Mois complet';
 if(q!==qo){
  document.querySelectorAll('#modal .pa-a[data-c="0"]').forEach(el=>{
   const l=S.paie.lines.find(x=>x.id===el.dataset.k),cur=parseAmount(el.value.trim());
   if(l&&!isNaN(cur)&&Math.abs(cur-paR2(paAmt(l,ym)*qo))<0.005)el.value=paNum(paR2(paAmt(l,ym)*q));
  });
  document.querySelectorAll('#modal .pa-a[data-c="1"]').forEach(el=>{el.dataset.man='0';});   // changer la période = recalculer les lignes calculées
  box.dataset.q=q;
 }
 paLive(null);
}

function saveSlip(){
 const ym=txCtx.pm,rows=[];
 const byId=Object.fromEntries(S.paie.lines.map(l=>[l.id,l]));
 for(const el of document.querySelectorAll('#modal .pa-a')){
  const t=el.value.trim();if(t==='')continue;
  const a=parseAmount(t);if(isNaN(a)){alert('Montant invalide.');return;}
  const l=byId[el.dataset.k];if(!l)continue;
  rows.push({k:l.id,label:l.label,kind:l.kind,amount:paR2(a)});   // signé : un transfert négatif (crédit) élargit la base des taux
 }
 const seen=new Set(rows.map(r=>r.k));
 for(const el of document.querySelectorAll('#modal .pa-x')){
  const label=el.querySelector('.pa-xl').value.trim(),t=el.querySelector('.pa-xa').value.trim();
  if(!label&&!t)continue;
  if(!label){alert('Libellé manquant sur une ligne ponctuelle.');return;}
  const a=parseAmount(t);if(isNaN(a)){alert('Montant invalide sur « '+label+' ».');return;}
  const k=el.dataset.k&&el.dataset.l===label?el.dataset.k:'x:'+norm(label);
  if(seen.has(k)){alert('Deux lignes portent le même libellé : « '+label+' ».');return;}
  seen.add(k);
  const px={k,label,kind:el.querySelector('.pa-xk').value,amount:paR2(a)};
  if(el.querySelector('.pa-xr').checked)px.rated=true;
  rows.push(px);
 }
 if(!rows.length){alert('Aucun montant saisi.');return;}
 // montants du modèle changés ce mois-ci : pour une fiche existante, on compare à sa valeur d'avant ; pour une nouvelle, au montant du modèle
 const dd=parseInt($('pa_d').value,10)||0,ff=parseInt($('pa_f').value,10)||0,days=paDays(ym,dd,ff);
 if(!days){alert('Période payée invalide : jours entre 1 et '+paDim(ym)+', début avant fin.');return;}
 const pr=days<30?{d:dd||1,f:ff||paDim(ym)}:null,q=days<30?days/30:1;
 const before=S.paie.slips[ym],changed=[];
 rows.forEach(r=>{
  const l=byId[r.k];if(!l||!paActive(l,ym))return;
  if(paIsCalc(l))return;
  if(q<1)return;   // mois proratisé : jamais de propagation au modèle
  const prev=before?before.rows.find(x=>x.k===r.k):null,base=prev?prev.amount:paAmt(l,ym);
  if(Math.abs(r.amount-base)>=0.005&&Math.abs(r.amount-paAmt(l,ym))>=0.005)changed.push({k:l.id,label:l.label,old:base,amt:r.amount,later:paLaterSlips(l.id,ym).filter(m=>m>ym).length});
 });
 if(changed.length){txCtx.pstash={ym,rows,changed,pr};openPropag();return;}
 paCommit(ym,rows,false,pr);
}

 if(mode==='acf'&&!(S.paie.acf.amount>0)){alert("Renseigne d'abord la valeur du point ACF (ligne « Valeur du point ACF » du modèle).");return;}
 if(mode==='rate'){
  l.base=[...document.querySelectorAll('#modal .pl-b:checked')].map(x=>x.value);
  if(!l.base.length){alert('Coche au moins une ligne comme base du calcul.');return;}
  const co=parseAmount($('pl_coef').value.trim()||'100');if(isNaN(co)||co<=0){alert('Part de la base invalide.');return;}
  l.coef=paR2(co);l.xp=$('pl_xp').checked;
  const cp=$('pl_cappct').value.trim(),cl=$('pl_capline').value;
  if(cp||cl){
   const pc=parseAmount(cp);if(!cp||!cl||isNaN(pc)||pc<=0){alert('Plafond incomplet : indique le pourcentage et la ligne, ou vide les deux.');return;}
   l.cap={pct:paR2(pc),line:cl};
  }
 }
 const others=S.paie.lines.filter(x=>!old||x.id!==old.id).concat([l]);
 if(paCycle(others)){alert('Cette base fait dépendre la ligne d\'elle-même (directement ou par une autre ligne calculée).');return;}
 const modeChanged=!!old&&(old.mode||'fixed')!==mode;
 const struct=!!old&&!modeChanged&&mode==='rate'&&JSON.stringify([old.base,old.coef,old.cap||null,!!old.xp])!==JSON.stringify([l.base,l.coef,l.cap||null,!!l.xp]);
 let recalcAll=false;
 if(old&&(modeChanged||struct)){
  const n=Object.keys(S.paie.slips).length;
  if(modeChanged&&!confirm('Changer le mode de calcul efface l\'historique de valeurs de cette ligne (échelons…). Continuer ?'))return;
  if(n)recalcAll=confirm('Recalculer cette ligne dans les '+n+' fiche'+(n>1?'s':'')+' déjà validée'+(n>1?'s':'')+' ? (OK = recalcul, Annuler = fiches inchangées)');
 }
 if(old&&old.hist&&!modeChanged)l.hist=old.hist;
 let from=null;
 if(old&&!modeChanged&&Math.abs(amt-txCtx.pcur)>0.004){
  from=paPickVal('pl_from');if(!from){alert("Indique le mois à partir duquel la nouvelle valeur s'applique.");return;}
  const note=$('pl_note').value.trim();
  const n=paLaterSlips(old.id,from).length;
  if(n&&!confirm(n+' fiche'+(n>1?'s':'')+' déjà validée'+(n>1?'s':'')+' à partir de '+monthLabel(from)+' '+(n>1?'seront modifiées':'sera modifiée')+'. Continuer ?'))return;
  paApply(l,from,amt,note,txCtx.pcur);
 }
 if(old)S.paie.lines[S.paie.lines.findIndex(x=>x.id===old.id)]=l;else S.paie.lines.push(l);
 // mois déjà validés que la ligne couvre désormais mais où elle n'existe pas : on propose de l'y ajouter
 const fill=Object.keys(S.paie.slips).filter(m=>paActive(l,m)&&!(old&&paActive(old,m))&&!S.paie.slips[m].rows.some(r=>r.k===l.id)).sort();
 if(fill.length&&confirm('Ajouter « '+label+' » aux '+fill.length+' fiche'+(fill.length>1?'s':'')+' déjà validée'+(fill.length>1?'s':'')+' ('+(fill.length>1?'de '+monthLabel(fill[0])+' à '+monthLabel(fill[fill.length-1]):monthLabel(fill[0]))+') avec le montant du modèle ?')){
  fill.forEach(m=>S.paie.slips[m].rows.push({k:l.id,label:l.label,kind:l.kind,amount:paIsCalc(l)?0:paAmt(l,m)}));
  if(paIsCalc(l))fill.forEach(m=>paRecalcMonth(m,new Set([l.id])));
 }
 if(recalcAll)paRecalcSlips('0000-00',new Set([l.id]));
 else if(from)paRecalcSlips(from);
 save();closeModal();render();
}

function saveTx(){
 const ty=document.querySelector('input[name=ty]:checked').value;
 const a=parseAmount($('f_amt').value);
 if(!(a>0)){alert('Montant invalide.');return;}
 const date=$('f_date').value;if(!date){alert('Date manquante.');return;}
 const payee=upP($('f_pay').value);
 const label=$('f_lab').value.trim()||payee||'Sans libellé';
 const prevTx=txCtx.id?S.tx.find(x=>x.id===txCtx.id):null;
 const accId=$('f_acc')?$('f_acc').value:((prevTx&&prevTx.acc)||defAcc());
 const isX=!!txCtx.xfer,pure=isX&&!txCtx.cnt;
 const xacc=(!isX&&$('f_xacc'))?$('f_xacc').value:'';
 if(xacc&&xacc===accId){alert('Choisis un autre compte pour le virement.');return;}
 const cat=pure?'Virement':$('f_cat').value,sub=pure?((prevTx&&prevTx.sub)||'Entre comptes'):$('f_sub').value;
 const amount=Math.round((ty==='dep'?-a:a)*100)/100;
 const before=autoCat(label,amount,payee);
 let tx;
 if(prevTx){tx=prevTx;Object.assign(tx,{date,label,amount,cat,sub,payee,acc:accId});}
 else{tx={id:uid(),date,label,amount,cat,sub,payee,acc:accId};if(txCtx.recKey)tx.recKey=txCtx.recKey;S.tx.push(tx);}
 if(isX){const o=xferOther(tx);if(o){o.amount=-amount;o.date=date;}}
 if(xacc)linkTransfer(tx,xacc);
 const kw=(payee&&kwFrom(payee))||kwFrom(label);
 if(!isX&&!xacc&&!txCtx.recKey&&kw&&sub!=='Non classé'&&(before.cat!==cat||before.sub!==sub||(payee&&payee!==before.payee))&&!S.rules.some(r=>r.kw===kw)){
  if(confirm('Classer automatiquement les lignes « '+kw+' » en '+cat+' › '+sub+' ?')){
   S.rules.push({kw,cat,sub,payee});
   S.tx.forEach(t=>{if(t.cat==='Divers'&&t.sub==='Non classé'&&norm(t.label+' '+(t.payee||'')).includes(kw)){t.cat=cat;t.sub=sub;if(payee&&!t.payee)t.payee=payee;}});
  }
 }
 save();closeModal();setAnchor(date);render();
}

function savePlan(){
 const label=$('pl_lab').value.trim();if(!label){alert('Libellé manquant.');return;}
 const common={label,payee:upP($('pl_pay').value),acc:$('pl_acc')?$('pl_acc').value:defAcc(),cat:$('pl_cat').value,sub:$('pl_sub').value,match:$('pl_match').value.trim()};
 if(txCtx.pid){
  const pl=S.plans.find(x=>x.id===txCtx.pid);if(!pl)return;
  const lock=planKeys();
  const items=pl.items.map(x=>({date:x.date,amount:x.amount}));
  for(let i=0;i<items.length;i++){
   if(lock.has(pl.id+'|'+items[i].date))continue;
   const dEl=$('pi_d'+i),aEl=$('pi_a'+i);if(!dEl||!aEl)continue;
   const v=parseAmount(aEl.value);
   if(!(v>0)||!dEl.value){alert('Échéance '+(i+1)+' : date ou montant invalide.');return;}
   items[i]={date:dEl.value,amount:-Math.round(v*100)/100};
  }
  items.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  Object.assign(pl,common,{items});
 }else{
  const total=parseAmount($('pl_total').value),n=parseInt($('pl_n').value),start=$('pl_start').value;
  if(!(total>0)){alert('Montant total invalide.');return;}
  if(!(n>=2&&n<=60)){alert("Nombre d'échéances : entre 2 et 60.");return;}
  if(!start){alert('Date de la première échéance manquante.');return;}
  S.plans.push(Object.assign({id:uid(),items:makePlanItems(total,n,start)},common));
 }
 save();closeModal();render();
}

function fromInfo(){
 const f=$('r_from'),t=$('r_fromtxt');if(!f||!t||!f.value)return;

 t.textContent='Toutes les échéances du '+frDate(f.value)+' et suivantes passeront au nouveau montant'+(n?' ('+n+' déjà enregistrée(s) seront modifiées).':'.')+' Celles d\'avant gardent l\'ancien montant.';

function recAffected(id,from){return S.tx.filter(t=>t.recKey&&t.recKey.indexOf(id+'|')===0&&t.recKey.split('|')[1]>=from);}
function changeAmount(hist,cur,from,amt){
 const h=(hist&&hist.length?hist:[{from:'0000-01-01',amount:cur}]).filter(e=>e.from<from);
 if(!h.length)h.push({from:'0000-01-01',amount:cur});
 h.push({from,amount:amt});
 return h.sort((x,y)=>x.from<y.from?-1:x.from>y.from?1:0);
}
function saveRec(){
 const ty=document.querySelector('input[name=rty]:checked').value;
 const a=parseAmount($('r_amt').value);
 if(!(a>0)){alert('Montant invalide.');return;}
 const label=$('r_lab').value.trim();if(!label){alert('Libellé manquant.');return;}
 const start=$('r_start').value;if(!start){alert('Date de départ manquante.');return;}
 const freq=$('r_freq').value;
 const newAmt=Math.round((ty==='dep'?-a:a)*100)/100;
 const old=txCtx.rid?S.rec.find(x=>x.id===txCtx.rid):null;
 const r={id:txCtx.rid||uid(),label,amount:newAmt,acc:$('r_acc')?$('r_acc').value:(old?old.acc:defAcc()),loan:$('r_loan')?$('r_loan').value:(old&&old.loan||''),cat:$('r_cat').value,sub:$('r_sub').value,freq,day:parseInt($('r_day').value)||parseInt(start.slice(8)),every:Math.max(1,parseInt($('r_every').value)||1),start,end:$('r_end').value||'',match:$('r_match').value.trim()};
 if(freq==='monthly'&&!$('r_day').value)r.day=parseInt(start.slice(8));
 if(old&&old.hist)r.hist=old.hist;
 if(old&&Math.abs(newAmt-txCtx.cur)>0.004){
  const from=$('r_from')?$('r_from').value:'';
  if(!from){alert("Indique la date à partir de laquelle le nouveau montant s'applique.");return;}
  const affected=recAffected(old.id,from);
  if(affected.length&&!confirm(affected.length+' écriture(s) déjà enregistrée(s) à partir du '+frDate(from)+' passeront à '+fmt(newAmt)+'. Continuer ?'))return;
  r.hist=changeAmount(old.hist,txCtx.cur,from,newAmt);
  affected.forEach(t=>{t.amount=newAmt;});
  r.amount=amountAt(r,today());
 }
 if(txCtx.rid)S.rec[S.rec.findIndex(x=>x.id===txCtx.rid)]=r;else S.rec.push(r);
 save();closeModal();render();
}

function bkSaved(){S.lastExport=today();S.bk.since=null;S.bk.snooze=null;save(true);}   // un export vaut pour tous les appareils (partagé)
function bkDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function bkPlus1(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+1);return ymd(x);}
function bkDue(){const b=S.bk,t=today();if(!b||b.every===0||!b.since||(b.snooze&&b.snooze>t))return null;const n=bkDays(b.since,t);return n>=b.every?{days:n,since:b.since}:null;}
function bkBannerHTML(){

 return `<div class="card warn"><b>Sauvegarde conseillée</b><div class="s">Des modifications ne sont pas sauvegardées depuis ${d.days} jour${d.days>1?'s':''} (depuis le ${frDate(d.since)}). ${S.lastExport?'Dernière sauvegarde : '+frDate(S.lastExport)+'.':'Aucune sauvegarde faite.'} ${syncSession&&syncKey?'Une copie chiffrée est en ligne, mais l’export reste la vraie sauvegarde.':'Tes données ne sont que sur cet appareil.'}</div><div class="btns" style="margin-top:8px"><button class="primary small" data-a="export">Sauvegarder maintenant</button><button class="ghost small" data-a="bk-later">Plus tard</button></div></div>`;
}

async function exportJSON(){
 const json=JSON.stringify(S,null,1);const name='compte-'+today()+'.json';
 const file=new File([json],name,{type:'application/json'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});bkSaved();render();return;}
 }catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
 bkSaved();render();
}
function doImport(){

 S.tx.forEach(t=>{if(t.acc!==imp.acc)return;const k=t.date+'|'+t.amount.toFixed(2)+'|'+norm(t.label);have[k]=(have[k]||0)+1;});
 let added=0,dup=0,last='';
 ok.forEach(r=>{
  const k=r.date+'|'+r.amount.toFixed(2)+'|'+norm(r.label);
  if(have[k]>0){have[k]--;dup++;return;}
  const c=autoCat(r.label,r.amount,r.payee);
  const tx={id:uid(),date:r.date,label:r.label,amount:r.amount,cat:c.cat,sub:c.sub,payee:c.payee||'',acc:imp.acc};
  linkRec(tx);S.tx.push(tx);added++;if(r.date>last)last=r.date;
 });
 S.csvMaps[imp.sig]=Object.assign({},imp.map,{acc:imp.acc});save();
 imp=null;
 if(last){setAnchor(last);per='month';}
 view='tx';render();
 alert(added+' ligne(s) importée(s), '+dup+' doublon(s) ignoré(s).'+(added?' Corrige les lignes « Non classé » : l\'app retiendra tes choix.':''));

function onFile(text){

 if(rows.length<2){alert('Fichier vide ou illisible.');return;}
 const max=Math.max(...rows.slice(0,10).map(r=>r.length));
 const hi=rows.findIndex(r=>r.length===max);
 const header=rows[hi].map(x=>x.trim());
 const data=rows.slice(hi+1).filter(r=>r.length>=Math.min(3,max));
 const sig=header.join('|');
 let map=S.csvMaps[sig];
 if(!map){
  const d=guessCol(header,/date/i),l=guessCol(header,/libell|label|descr|d[ée]tail|objet|intitul/i);
  const a=guessCol(header,/montant|amount|somme/i),db=guessCol(header,/d[ée]bit/i),cr=guessCol(header,/cr[ée]dit/i);
  let py=guessCol(header,/tiers|b[ée]n[ée]ficiaire|payee|commer[cç]ant|marchand|merchant|contrepartie|[ée]metteur|nom/i);if(py===l||py===d)py=-1;
  map={date:d,label:l,payee:py,amount:a,debit:db,credit:cr,mode:(a<0&&db>=0&&cr>=0)?'split':'single'};
 }
 if(map.payee===undefined){const l=map.label,d=map.date;let py=guessCol(header,/tiers|b[ée]n[ée]ficiaire|payee|commer[cç]ant|marchand|merchant|contrepartie|[ée]metteur|nom/i);if(py===l||py===d)py=-1;map=Object.assign({},map,{payee:py});}
 imp={header,data,sig,map,acc:(map.acc&&accById(map.acc))?map.acc:defAcc()};render();
}

/* ---------- synchronisation chiffrée (ARCHITECTURE.md, « Synchronisation ») ----------
   Local d'abord : le localStorage reste la référence, l'app marche sans réseau. Connecté, une copie CHIFFRÉE (AES-GCM, clé dérivée d'une phrase secrète
   que le serveur ne voit jamais) est envoyée à Supabase (table `donnees`, app = « suivi ») et relue toutes les 5 s. Aucune bibliothèque : fetch + WebCrypto.
   Clés : « meta » (comptes, récurrences, plans, règles, budgets, correspondances CSV, échéances ignorées) et « tx:AAAA-MM » (les lignes d'un mois).
   Reste local à l'appareil : `shown` (comptes cochés). `lastExport` et `bk` (état du rappel de sauvegarde) sont partagés : une sauvegarde faite sur un appareil vaut pour tous. Lignes en clair : « sel » (sel public) ; « verif » (témoin chiffré de la phrase). */
const SYNC_URL='https://zoyrclsppuhgnyzgodjv.supabase.co';
const SYNC_KEY='sb_publishable_rHeMIa4CSjCjZXpAI-0tTQ_QC1O06Ng';   // clé publique : la protection vient des règles d'accès de la table
const SYNC_APP='suivi';
const SYNC_SESSION_KEY='compte-sync-session',SYNC_META_KEY='compte-sync-meta',SYNC_CLE_KEY='compte-sync-cle',SYNC_LOST_KEY='compte-sync-conflits';
const SYNC_POLL_MS=5000,SYNC_PBKDF2=600000,SYNC_MIN_PHRASE=12;
const SYNC_META_FIELDS=['v','accounts','rec','plans','rules','budgets','payDates','csvMaps','skips','paie','lastExport','bk'];
let syncSession=null,syncKey=null,syncKeyMode=null,syncMeta={since:null,synced:{},done:false};
let syncState={status:'start',last:null,msg:''},syncBusy=false,syncAgain=false,syncTimer=null,syncRefreshing=null,syncUiPending=false,syncCache={raw:undefined,out:null},syncMetaText='';
const SYNC_ENC=new TextEncoder(),SYNC_DEC=new TextDecoder();

function cyrb53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v);}
const hashOf=v=>cyrb53(canon(v));
function syncErr(code,message,status){const e=new Error(message||code);e.code=code;if(status)e.status=status;return e;}
async function syncHttpError(res){let m='';try{const j=await res.json();m=j.message||j.msg||j.error_description||'';}catch(e){}return syncErr('http','HTTP '+res.status+(m?' : '+m:''),res.status);}

/* ----- chiffrement ----- */
function b64enc(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);}
function b64dec(t){const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function syncDerive(pass,saltB64){
 const base=await crypto.subtle.importKey('raw',SYNC_ENC.encode(pass.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64dec(saltB64),iterations:SYNC_PBKDF2,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function syncEncrypt(cle,obj){   // le nom de la ligne est authentifié : le serveur ne peut pas échanger deux lignes sans que le déchiffrement échoue
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:SYNC_ENC.encode(cle)},syncKey,SYNC_ENC.encode(JSON.stringify(obj)));
 return {iv:b64enc(iv),c:b64enc(ct)};
}
async function syncDecrypt(cle,env,key){
 if(!env||typeof env.iv!=='string'||typeof env.c!=='string')throw syncErr('crypto','valeur illisible');
 try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(env.iv),additionalData:SYNC_ENC.encode(cle)},key||syncKey,b64dec(env.c));return JSON.parse(SYNC_DEC.decode(pt));}
 catch(e){throw syncErr('crypto','déchiffrement impossible (phrase secrète différente ?)');}
}
async function syncStoreKey(key){syncKey=key;try{localStorage.setItem(SYNC_CLE_KEY,b64enc(await crypto.subtle.exportKey('raw',key)));}catch(e){}}
async function syncLoadKey(){
 syncKey=null;
 try{const t=localStorage.getItem(SYNC_CLE_KEY);if(t)syncKey=await crypto.subtle.importKey('raw',b64dec(t),{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}catch(e){syncKey=null;}
}

/* ----- session et état propre à l'appareil ----- */
function syncLoad(){
 syncSession=null;syncMeta={since:null,synced:{},done:false};
 try{const s=JSON.parse(localStorage.getItem(SYNC_SESSION_KEY));if(s&&typeof s.at==='string'&&typeof s.rt==='string')syncSession={at:s.at,rt:s.rt,exp:Number(s.exp)||0,uid:typeof s.uid==='string'?s.uid:'',email:typeof s.email==='string'?s.email:''};}catch(e){}
 try{const m=JSON.parse(localStorage.getItem(SYNC_META_KEY));if(m&&typeof m==='object')syncMeta={since:typeof m.since==='string'?m.since:null,synced:m.synced&&typeof m.synced==='object'?m.synced:{},done:m.done===true};}catch(e){}
}
function syncSessionSave(){try{if(syncSession)localStorage.setItem(SYNC_SESSION_KEY,JSON.stringify(syncSession));else localStorage.removeItem(SYNC_SESSION_KEY);}catch(e){}}
function syncMetaSave(){try{const t=JSON.stringify(syncMeta);if(t!==syncMetaText){localStorage.setItem(SYNC_META_KEY,t);syncMetaText=t;}}catch(e){}}
function syncClearSession(){
 syncSession=null;syncKey=null;syncKeyMode=null;syncMeta={since:null,synced:{},done:false};syncMetaText='';syncCache={raw:undefined,out:null};
 try{[SYNC_SESSION_KEY,SYNC_META_KEY,SYNC_CLE_KEY].forEach(k=>localStorage.removeItem(k));}catch(e){}
}
function syncStoreSession(j,prev){
 syncSession={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(Number(j.expires_in)||3600)*1000,uid:(j.user&&j.user.id)||(prev&&prev.uid)||'',email:(j.user&&j.user.email)||(prev&&prev.email)||''};
 syncSessionSave();
}
function syncKeepLost(cle,who,valeur){   // filet de sécurité : ce qui perd un conflit est gardé (5 dernières copies)
 try{let l=[];try{l=JSON.parse(localStorage.getItem(SYNC_LOST_KEY))||[];}catch(e){l=[];}l.push({cle:cle,quand:new Date().toISOString(),perdant:who,valeur:valeur});localStorage.setItem(SYNC_LOST_KEY,JSON.stringify(l.slice(-5)));}catch(e){}
}

/* ----- réseau ----- */
async function syncLogin(email,password){
 const res=await fetch(SYNC_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SYNC_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
 if(res.status===400||res.status===401||res.status===422)throw syncErr('bad','identifiants refusés',res.status);
 if(!res.ok)throw await syncHttpError(res);
 const j=await res.json();
 if(!j||typeof j.access_token!=='string'||typeof j.refresh_token!=='string')throw syncErr('http','réponse inattendue');
 syncKey=null;syncKeyMode=null;syncMeta={since:null,synced:{},done:false};syncMetaText='';syncCache={raw:undefined,out:null};
 try{localStorage.removeItem(SYNC_CLE_KEY);}catch(e){}
 syncStoreSession(j,null);syncMetaSave();
}
function syncRefresh(){
 if(!syncSession)return Promise.reject(syncErr('auth','non connecté'));
 if(syncRefreshing)return syncRefreshing;
 const prev=syncSession;
 syncRefreshing=(async()=>{
  const res=await fetch(SYNC_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SYNC_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:prev.rt})});
  if(res.status===400||res.status===401||res.status===403){syncClearSession();throw syncErr('auth','session expirée',res.status);}
  if(!res.ok)throw await syncHttpError(res);
  syncStoreSession(await res.json(),prev);
 })();
 const done=()=>{syncRefreshing=null;};syncRefreshing.then(done,done);
 return syncRefreshing;
}
async function syncFetch(path,opts,retried){
 if(!syncSession)throw syncErr('auth','non connecté');
 if(Date.now()>syncSession.exp-60000)await syncRefresh();
 const headers=Object.assign({apikey:SYNC_KEY,'Content-Type':'application/json',Authorization:'Bearer '+syncSession.at},(opts&&opts.headers)||{});
 const res=await fetch(SYNC_URL+path,{method:(opts&&opts.method)||'GET',headers:headers,body:opts&&opts.body});
 if(res.status===401){
  if(retried){syncClearSession();throw syncErr('auth','session expirée',401);}
  await syncRefresh();return syncFetch(path,opts,true);
 }
 return res;
}
async function syncGetRow(cle){
 const res=await syncFetch('/rest/v1/donnees?select=cle,valeur&app=eq.'+SYNC_APP+'&cle=eq.'+encodeURIComponent(cle),{});
 if(!res.ok)throw await syncHttpError(res);
 const rows=await res.json();
 return Array.isArray(rows)&&rows[0]?rows[0]:null;
}
async function syncPostRows(rows,ignoreDup){
 const body=JSON.stringify(rows.map(r=>{const o={app:SYNC_APP,cle:r.cle,valeur:r.valeur};if(syncSession.uid)o.user_id=syncSession.uid;return o;}));
 const res=await syncFetch('/rest/v1/donnees?on_conflict=user_id,app,cle',{method:'POST',headers:{Prefer:(ignoreDup?'resolution=ignore-duplicates':'resolution=merge-duplicates')+',return=minimal'},body:body});
 if(!res.ok)throw await syncHttpError(res);
}

/* ----- phrase secrète ----- */
async function syncCheckSel(){   // une phrase existe-t-elle déjà côté serveur ? détermine l'écran à afficher
 const sel=await syncGetRow('sel');
 syncKeyMode=sel?'enter':'new';
}
async function syncSetPass(pass,pass2){
 if(syncKeyMode==='new'){
  if(pass.length<SYNC_MIN_PHRASE)throw syncErr('short','La phrase secrète doit faire au moins '+SYNC_MIN_PHRASE+' caractères.');
  if(pass!==pass2)throw syncErr('short','Les deux phrases ne sont pas identiques.');
 }
 let sel=await syncGetRow('sel');
 if(!sel){
  await syncPostRows([{cle:'sel',valeur:{salt:b64enc(crypto.getRandomValues(new Uint8Array(16)))}}],true);
  sel=await syncGetRow('sel');            // si un autre appareil l'a créé entre-temps, c'est lui qui fait foi
 }
 if(!sel||!sel.valeur||typeof sel.valeur.salt!=='string')throw syncErr('http','sel illisible côté serveur');
 const key=await syncDerive(pass,sel.valeur.salt);
 let ver=await syncGetRow('verif');
 if(!ver){
  syncKey=key;
  await syncPostRows([{cle:'verif',valeur:await syncEncrypt('verif',{ok:1})}],true);
  syncKey=null;
  ver=await syncGetRow('verif');
 }
 let ok=false;
 try{const v=await syncDecrypt('verif',ver&&ver.valeur,key);ok=!!v&&v.ok===1;}catch(e){ok=false;}
 if(!ok)throw syncErr('badpass','Phrase secrète incorrecte.');
 await syncStoreKey(key);
 syncKeyMode=null;
 syncMeta={since:null,synced:{},done:false};syncMetaText='';syncMetaSave();
}

/* ----- état local vu comme des clés (lecture brute, jamais via migrate) ----- */
const syncMonthOf=t=>t&&typeof t.date==='string'&&/^\d{4}-\d{2}/.test(t.date)?t.date.slice(0,7):'0000-00';
function syncLocal(){
 let raw;try{raw=localStorage.getItem(KEY);}catch(e){throw syncErr('local','stockage indisponible sur cet appareil');}
 if(syncCache.out&&syncCache.raw===raw)return syncCache.out;
 const out={};
 if(raw!==null){
  let o;try{o=JSON.parse(raw);}catch(e){o=null;}
  if(!o||typeof o!=='object'||!Array.isArray(o.tx))throw syncErr('local','données illisibles sur cet appareil : synchronisation suspendue');
  const meta={};SYNC_META_FIELDS.forEach(k=>{if(k in o)meta[k]=o[k];});
  out.meta={data:meta,hash:hashOf(meta)};
  const by={};o.tx.forEach(t=>{const m=syncMonthOf(t);(by[m]=by[m]||[]).push(t);});
  Object.keys(by).forEach(m=>{out['tx:'+m]={data:by[m],hash:hashOf(by[m])};});
 }
 syncCache={raw:raw,out:out};
 return out;
}
const syncKeyOk=k=>k==='meta'||/^tx:\d{4}-\d{2}$/.test(k);
const syncModalOpen=()=>{const m=$('modal');return !!(m&&m.classList.contains('open'));};

/* ----- lecture : ce qui a changé ailleurs ----- */
async function syncPull(){
 let path='/rest/v1/donnees?select=cle,valeur,maj&app=eq.'+SYNC_APP+'&order=maj.asc';
 if(syncMeta.since)path+='&maj=gt.'+encodeURIComponent(new Date(Date.parse(syncMeta.since)-3000).toISOString());   // marge de 3 s : relire deux fois ne coûte rien
 const res=await syncFetch(path,{});
 if(!res.ok)throw await syncHttpError(res);
 const rows=await res.json();
 if(!Array.isArray(rows))throw syncErr('http','réponse inattendue');
 const first=!syncMeta.done,local=syncLocal();
 let maxMaj=syncMeta.since,newMeta=null;
 const monthChanges={},synced={},lost=[];
 for(const row of rows){
  if(!row||typeof row.cle!=='string')continue;
  if(row.maj&&(!maxMaj||Date.parse(row.maj)>Date.parse(maxMaj)))maxMaj=row.maj;
  const key=row.cle;
  if(!syncKeyOk(key))continue;                                              // « sel » et « verif » ne sont pas des données
  const env=await syncDecrypt(key,row.valeur);
  if(!env||typeof env!=='object'||!('d' in env))continue;
  const rdata=env.d;
  if(key==='meta'&&(rdata===null||typeof rdata!=='object'))continue;
  if(key!=='meta'&&rdata!==null&&!Array.isArray(rdata))continue;
  const rhash=rdata===null?null:hashOf(rdata),l=local[key],lhash=l?l.hash:null;
  if(rhash===lhash){synced[key]=rhash;continue;}                            // déjà identique (par exemple mon propre envoi)
  const isDirty=l?l.hash!==syncMeta.synced[key]:(key in syncMeta.synced);   // modifié (ou supprimé) ici depuis la dernière synchro
  if(isDirty&&!first){lost.push([key,'distant',rdata]);continue;}           // conflit : la version de cet appareil est envoyée ensuite
  if(isDirty&&first&&l)lost.push([key,'local',l.data]);                     // première synchro : le distant l'emporte, l'ancienne version est gardée
  if(key==='meta')newMeta=rdata;else monthChanges[key.slice(3)]=rdata;
  synced[key]=rhash;
 }
 const needsApply=!!newMeta||Object.keys(monthChanges).length>0;
 if(needsApply&&syncModalOpen())return null;                                // saisie en cours : on réessaie au prochain passage
 lost.forEach(x=>syncKeepLost(x[0],x[1],x[2]));
 let applied=false;
 if(needsApply){
  try{
   const cand=JSON.parse(JSON.stringify(S));
   if(newMeta)SYNC_META_FIELDS.forEach(k=>{if(k in newMeta)cand[k]=newMeta[k];});
   const months=Object.keys(monthChanges);
   if(months.length){cand.tx=cand.tx.filter(t=>months.indexOf(syncMonthOf(t))<0);months.forEach(m=>{if(monthChanges[m])cand.tx=cand.tx.concat(monthChanges[m]);});}
   S=migrate(cand);reanchor();
   localStorage.setItem(KEY,JSON.stringify(S));
   applied=true;
  }catch(e){throw syncErr('local','enregistrement impossible sur cet appareil');}
 }
 syncCache={raw:undefined,out:null};
 const after=syncLocal();
 Object.keys(synced).forEach(key=>{if(after[key])syncMeta.synced[key]=after[key].hash;else delete syncMeta.synced[key];});   // l'empreinte retenue est celle de ce qui est réellement enregistré ici
 syncMeta.since=maxMaj;syncMeta.done=true;
 return applied;
}

/* ----- écriture : ce qui a changé ici ----- */
async function syncPush(){
 const local=syncLocal(),rows=[];
 Object.keys(local).forEach(key=>{if(local[key].hash!==syncMeta.synced[key])rows.push({key:key,data:local[key].data,hash:local[key].hash});});
 Object.keys(syncMeta.synced).forEach(key=>{if(!local[key])rows.push({key:key,data:null,hash:null});});   // supprimé ici : supprimé partout
 for(let i=0;i<rows.length;i+=20){
  const chunk=rows.slice(i,i+20),body=[];
  for(const r of chunk)body.push({cle:r.key,valeur:await syncEncrypt(r.key,{d:r.data})});
  await syncPostRows(body,false);
  chunk.forEach(r=>{if(r.hash===null)delete syncMeta.synced[r.key];else syncMeta.synced[r.key]=r.hash;});
 }
}

/* ----- cycle ----- */
async function syncNow(){
 if(!syncSession||!syncKey)return;
 if(syncBusy){syncAgain=true;return;}
 syncBusy=true;clearTimeout(syncTimer);
 let applied=false;
 try{
  applied=await syncPull();
  await syncPush();
  syncState.last=new Date();setSyncStatus('ok');
 }catch(e){
  if(e&&e.code==='auth')setSyncStatus('auth');
  else if(e instanceof TypeError||navigator.onLine===false)setSyncStatus('offline');
  else setSyncStatus('error',e&&e.message?e.message:String(e));
 }finally{
  syncMetaSave();syncBusy=false;
  if(syncAgain){syncAgain=false;syncSchedule(300);}
 }
 if(applied)syncRefreshUi(true);
}
function syncSchedule(ms){if(!syncSession||!syncKey)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms);}
function syncTouch(){syncSchedule(1500);}   // appelé après chaque enregistrement local
function syncSafeToRender(){const a=document.activeElement;return !syncModalOpen()&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
function syncRefreshUi(fresh){
 if(fresh)syncUiPending=true;
 if(!syncUiPending||!syncSafeToRender())return;   // on affiche au prochain passage, pour ne pas voler la saisie
 syncUiPending=false;pruneSel();render();
}
function syncPoll(){
 offbarUpdate();
 if(!syncSession||!syncKey||document.hidden||navigator.onLine===false)return;
 if(syncUiPending)syncRefreshUi(false);
 syncNow();
}
async function syncStart(){
 if(typeof crypto==='undefined'||!crypto.subtle)return;
 await syncLoadKey();
 setInterval(syncPoll,SYNC_POLL_MS);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
 window.addEventListener('online',()=>{syncNow();});
 window.addEventListener('offline',offbarUpdate);
 window.addEventListener('resize',offbarUpdate);
 if(syncSession&&syncKey)syncNow();
 else if(syncSession){try{await syncCheckSel();}catch(e){}syncRenderBox();}
}

/* ----- écran : Réglages › Synchronisation ----- */
const hhmmss=d=>pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
function syncStatusText(){
 const s=syncState;
 if(s.status==='ok'&&s.last)return 'Synchronisé à '+hhmmss(s.last)+'.';
 if(s.status==='offline')return 'Hors ligne : tes modifications partiront dès le retour du réseau.';
 if(s.status==='error')return 'Erreur : '+s.msg+' (nouvel essai automatique).';
 return 'Synchronisation en cours…';
}
/* Bannière « Hors ligne » : visible sur tous les écrans, au-dessus des onglets, sans rien bloquer (pointer-events:none). Affichée seulement si un compte est connecté
   (sinon il n'y a rien à synchroniser) et que le réseau manque : navigateur hors ligne, ou dernière tentative de synchro tombée en échec réseau. */
function offbarUpdate(){
 const el=$('offbar');if(!el)return;
 const off=!!(syncSession&&syncKey&&(syncState.status==='offline'||navigator.onLine===false));
 if(off){const n=document.querySelector('nav');if(n)document.documentElement.style.setProperty('--navh',n.offsetHeight+'px');}
 el.hidden=!off;document.body.classList.toggle('off',off);
}
function setSyncStatus(status,msg){
 const was=syncState.status;syncState.status=status;syncState.msg=msg||'';offbarUpdate();
 if(status==='auth'||was==='auth')syncRenderBox();else{const el=$('sync-status');if(el)el.textContent=syncStatusText();}
}
function syncBoxHTML(){
 if(typeof crypto==='undefined'||!crypto.subtle)return '<p class="s">La synchronisation n’est pas disponible ici : le chiffrement du navigateur est absent (ouvre l’app depuis son adresse https).</p>';
 if(!syncSession)return `<p class="s">Retrouve tes comptes sur tes autres appareils. Les données restent d’abord sur cet appareil ; une copie <b>chiffrée</b> est envoyée à ton compte, que seule ta phrase secrète permet de lire.</p>
  ${syncState.status==='auth'?'<p class="s" role="alert" style="color:var(--red)">Ta session a expiré : reconnecte-toi.</p>':''}
  <label>E-mail<input id="sync-email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
  <label>Mot de passe du compte<input id="sync-pass" type="password" autocomplete="current-password"></label>
  <div class="btns"><button class="primary" data-a="sync-login">Se connecter</button></div><p class="s" id="sync-msg" role="alert" hidden></p>`;
 if(!syncKey){
  const nw=syncKeyMode==='new';
  return `<p>Connecté : <b>${esc(syncSession.email||'compte')}</b></p>
  ${syncKeyMode===null?'<p class="s">Vérification…</p><div class="btns"><button class="ghost" data-a="sync-retry">Réessayer</button><button class="ghost" data-a="sync-logout">Se déconnecter</button></div>':
  `<p class="s">${nw?'<b>Crée ta phrase secrète.</b> Elle chiffre tes données avant l’envoi. <b>Elle doit être différente du mot de passe du compte</b> et d’au moins '+SYNC_MIN_PHRASE+' caractères. <b>Si tu la perds, les données en ligne sont perdues</b> (tes données sur l’appareil et ton export JSON restent valables). Note-la en lieu sûr.':'Saisis ta phrase secrète pour cet appareil. Elle ne sera demandée qu’une fois.'}</p>
  <label>Phrase secrète<input id="sync-phrase" type="password" autocomplete="off"></label>
  ${nw?'<label>Répète la phrase secrète<input id="sync-phrase2" type="password" autocomplete="off"></label>':''}
  <div class="btns"><button class="primary" data-a="sync-phrase">${nw?'Créer et synchroniser':'Valider'}</button><button class="ghost" data-a="sync-logout">Se déconnecter</button></div><p class="s" id="sync-msg" role="alert" hidden></p>`}`;
 }
 return `<p>Connecté : <b>${esc(syncSession.email||'compte')}</b></p><p class="s" id="sync-status">${esc(syncStatusText())}</p>
  <div class="btns"><button class="primary" data-a="sync-now">Synchroniser maintenant</button><button class="ghost" data-a="sync-logout">Se déconnecter</button></div>
  <p class="s">Chaque modification est envoyée chiffrée en quelques secondes ; les changements faits ailleurs arrivent seuls. Attention : « Restaurer » un fichier et « Tout effacer » s’appliquent aussi sur tes autres appareils connectés.</p>`;
}
function syncRenderBox(){offbarUpdate();const b=$('sync-box');if(b)b.innerHTML=syncBoxHTML();}
function syncSay(t){const m=$('sync-msg');if(m){m.textContent=t;m.hidden=!t;}}
async function syncAct(a){
 if(a==='sync-login'){
  const email=($('sync-email')||{}).value,pass=($('sync-pass')||{}).value;
  if(!email||!email.trim()||!pass){syncSay('Saisis ton e-mail et ton mot de passe.');return;}
  syncSay('Connexion…');
  try{await syncLogin(email.trim(),pass);}
  catch(e){syncSay(e&&e.code==='bad'?'E-mail ou mot de passe incorrect.':(e instanceof TypeError?'Pas de réseau : connexion impossible.':'Connexion impossible ('+(e&&e.message?e.message:'erreur')+').'));return;}
  syncState={status:'start',last:null,msg:''};syncRenderBox();
  try{await syncCheckSel();}catch(e){}
  syncRenderBox();
 }else if(a==='sync-retry'){
  try{await syncCheckSel();}catch(e){}
  syncRenderBox();
 }else if(a==='sync-phrase'){
  const p=($('sync-phrase')||{}).value||'',p2=($('sync-phrase2')||{}).value||'';
  if(!p){syncSay('Saisis la phrase secrète.');return;}
  syncSay('Vérification… (quelques secondes)');
  try{await syncSetPass(p,p2);}
  catch(e){syncSay(e&&(e.code==='short'||e.code==='badpass')?e.message:(e instanceof TypeError?'Pas de réseau.':'Impossible ('+(e&&e.message?e.message:'erreur')+').'));if(e&&e.code==='auth'){syncRenderBox();}return;}
  syncState={status:'start',last:null,msg:''};syncRenderBox();
  alert('Synchronisation activée. Rappel : ta phrase secrète n’est récupérable nulle part. Note-la en lieu sûr.');
  syncNow();
 }else if(a==='sync-now'){syncNow();}
 else if(a==='sync-logout'){
  const at=syncSession?syncSession.at:null;
  syncClearSession();syncState={status:'start',last:null,msg:''};clearTimeout(syncTimer);
  if(at){try{fetch(SYNC_URL+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:SYNC_KEY,Authorization:'Bearer '+at}}).catch(()=>{});}catch(e){}}
  syncRenderBox();
 }
}
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||!e.target.id||e.target.id.indexOf('sync-')!==0)return;
 e.preventDefault();syncAct(e.target.id==='sync-email'||e.target.id==='sync-pass'?'sync-login':'sync-phrase');
});

/* ---------- démarrage ---------- */
if(typeof document!=='undefined'&&document.getElementById('app')){
 if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(ok=>{persisted=ok;}).catch(()=>{});}
 if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
 syncLoad();
 if(payFixed){save(true);}   // tiers passés en majuscules par la migration : à enregistrer (et synchroniser) une fois
 render();
 syncStart();
}
</script>
